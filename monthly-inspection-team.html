<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>월간점검결과-점검팀</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0.3' y2='1'%3E%3Cstop offset='0' stop-color='%234A9BE8'/%3E%3Cstop offset='1' stop-color='%230C447C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='5.3' fill='url(%23g)'/%3E%3Cpath d='M6 8h12M6 12h12M6 16h8' stroke='%23fff' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  /* work-portal 공통 색상 팔레트(하자보수현황·태양광발전량 앱과 수치 동일) */
  --sky:#0366D6;--sky50:#E9F1FE;--sky100:#C7DCF6;--sky600:#005CC5;--sky800:#032F62;
  --teal:#1D9E75;--teal50:#E1F5EE;--teal100:#9FE1CB;--teal600:#0F6E56;
  --coral:#D85A30;--coral50:#FAECE7;--coral100:#F5C4B3;--coral800:#712B13;
  --amber:#BA7517;--amber50:#FAEEDA;--amber100:#FAC775;--amber800:#633806;
  --green:#639922;--green50:#EAF3DE;--green100:#C0DD97;--green800:#27500A;
  --purple:#534AB7;--purple50:#EEEDFE;--purple100:#CECBF6;
  --gray50:#F1EFE8;--gray100:#D3D1C7;--gray200:#B4B2A9;--gray600:#5F5E5A;
  --bg:#FFFFFF;--card:#FFFFFF;--border:#E1E4E8;--border2:#F6F8FA;
  --txt:#24292E;--txt2:#3A4453;--txt3:#6A737D;
  --r6:6px;--r8:8px;--r10:10px;--r12:12px;--r14:14px;--r16:16px;--r20:20px;
  --shadow:none;
  --hdr-bg:#032F62;
  --hdr-text:#fff;
  --hdr-text-dim:rgba(255,255,255,.85);
  --hdr-btn-bg:rgba(255,255,255,.15);
  --hdr-btn-border:rgba(255,255,255,.35);
  --hdr-btn-hover-bg:rgba(255,255,255,.25);
  --hdr-btn-text:#fff;
  --hdr-shadow:0 2px 8px rgba(3,47,98,.3);
  --hdr-error-text:rgba(255,150,130,.9);
  --rp-filled-bg:rgba(79,70,229,.10);
  color-scheme:light;
}
html[data-theme="light"]{
  color-scheme:light;
  --hdr-bg:#FFFFFF;
  --hdr-text:#032F62;
  --hdr-text-dim:#355E82;
  --hdr-btn-bg:#E6F1FB;
  --hdr-btn-border:#B7CEE8;
  --hdr-btn-hover-bg:#D3E7FA;
  --hdr-btn-text:#005CC5;
  --hdr-shadow:0 2px 8px rgba(12,68,124,.12);
  --hdr-error-text:#B3261E;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#24292E;--card:#1C2024;
  --border:rgba(255,255,255,.13);--border2:rgba(255,255,255,.09);
  --txt:rgba(255,255,255,.92);--txt2:rgba(255,255,255,.75);--txt3:rgba(255,255,255,.5);
  --shadow:none;
  --hdr-bg:#24292E;
  --hdr-shadow:0 2px 10px rgba(0,0,0,.4);
  --hdr-error-text:rgba(255,150,130,.9);
  --sky:#2E8FFF;
  --sky50:rgba(46,143,255,.16);--sky100:rgba(46,143,255,.32);
  --sky600:#79B8FF;--sky800:#C8E1FF;
  --teal50:rgba(29,158,117,.16);--teal100:rgba(29,158,117,.32);
  --teal600:#4FD8AC;
  --coral:#F2896A;--coral50:rgba(216,90,48,.16);--coral100:rgba(216,90,48,.32);--coral800:#F0916A;
  --amber50:rgba(186,117,23,.16);--amber100:rgba(186,117,23,.32);--amber800:#F0B961;
  --green50:rgba(99,153,34,.16);--green100:rgba(99,153,34,.32);
  --purple50:rgba(83,74,183,.18);--purple100:rgba(83,74,183,.34);
  --rp-filled-bg:rgba(129,140,248,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100dvh}

/* ── HEADER ── */
.header{background:var(--hdr-bg);height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--hdr-shadow);transition:background .18s ease;}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:1}
/* 로그인 전(⚠ 로그인 필요 안내) 등 last-update 문구가 길어지는 상태에서 header-right가 넓어지면
   header-left가 좁아지는데, 기존엔 줄바꿈되어 44px 고정 header 높이를 넘어 위로 잘려 보이는 문제가
   있었다 — nowrap+ellipsis로 잘림 없이 말줄임 처리 */
.logo-title{font-size:14.5px;font-weight:700;color:var(--hdr-text);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;flex-direction:row;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.header-btns{display:flex;gap:6px;flex-shrink:0}
.hdr-btn{background:var(--hdr-btn-bg);border:1px solid var(--hdr-btn-border);color:var(--hdr-btn-text);border-radius:16px;padding:4px 11px;font-size:12px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;min-height:27px;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0}
.hdr-btn:hover{background:var(--hdr-btn-hover-bg)}
.hdr-btn:disabled{opacity:.4;cursor:not-allowed}
.last-update{font-size:11px;color:var(--hdr-text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite;display:inline-block}

/* ── TOP TAB NAV (7개 탭 — 좁은 화면에서는 가로 스크롤) ── */
.top-tabs{background:var(--card);border-bottom:1.5px solid var(--border);display:flex;padding:0 6px;box-shadow:0 2px 8px rgba(55,138,221,.07);overflow-x:auto;-webkit-overflow-scrolling:touch}
.top-tab{flex:0 0 auto;min-width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:var(--txt2);font-size:14px;font-weight:400;font-family:inherit;cursor:pointer;padding:8px 6px;-webkit-tap-highlight-color:transparent;transition:color .15s;position:relative;white-space:nowrap}
.top-tab.active{color:var(--sky600)}
html[data-theme="dark"] .top-tab.active{color:#fff}
.top-tab .tt-label{display:inline-block;padding:0 10px 6px;border-bottom:2.5px solid transparent;border-radius:2px 2px 0 0}
.top-tab.active .tt-label{border-bottom-color:var(--sky)}
html[data-theme="dark"] .form-group-hd,
html[data-theme="dark"] .report-section-hd,
html[data-theme="dark"] th,
html[data-theme="dark"] .rc-monthly-table th{color:#fff;font-weight:400}

/* ── MAIN ── */
.main{padding:10px 12px;max-width:1400px;margin:0 auto}
.panel{display:none}.panel.active{display:block}

/* ── DD (목록방식 드롭다운, 3-9 표준) ── */
.dd-wrap{position:relative;display:inline-block}
.dd-btn{background:var(--sky50);border:1.5px solid var(--sky100);color:var(--sky800);border-radius:var(--r8);padding:5px 28px 5px 10px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;min-height:30px;white-space:nowrap;display:flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent;user-select:none;position:relative;transition:border-color .15s}
.dd-btn::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--sky600)}
.dd-btn.active{background:#1565C0;color:#fff;border-color:#1565C0}
.dd-btn.active::after{color:#fff}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r12);box-shadow:0 8px 24px rgba(3,102,214,.15);z-index:500;min-width:150px;display:none;overflow-y:auto;max-height:280px;scrollbar-width:none}
.dd-menu::-webkit-scrollbar{display:none}
.dd-menu.open{display:block}
.dd-opt{padding:9px 14px;font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;border-bottom:1px solid var(--border2)}
.dd-opt:hover{background:var(--sky50)}
.dd-opt.sel{background:#1565C0;color:#fff;font-weight:700}

/* ── SECTION CARD ── */
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r16);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.detail-sc{background:transparent;border:none;box-shadow:none}
.detail-sc .tbl-wrap{background:var(--card);box-shadow:var(--shadow)}
.sc-hd{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;background:var(--sky50);color:var(--sky600);border-radius:var(--r8);padding:3px 10px;border:1px solid var(--sky100)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r8);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:300px}
/* 입력폼 탭(report-paper) 안의 표는 목록 탭과 달리 화면을 꽉 채울 필요가 없다 — 컬럼 내용에 맞는
   자연폭으로 왼쪽 정렬하고, 필요한 표만(점검내용처럼 텍스트가 긴 컬럼) 알아서 넓어지게 한다
   (2026-07-31 사용자 요청 — 월간점검 표 방식을 입력폼 전체 기준으로 통일, 안전관리 앱과 동일). */
.report-paper table{width:auto;min-width:0}
thead tr{background:var(--sky50)}
th{padding:7px 10px;text-align:left;font-size:13px;font-weight:400;color:var(--sky800);white-space:nowrap;border-bottom:1.5px solid var(--sky100)}
html[data-theme="dark"] th{color:#fff}
th.r,td.r{text-align:right}
td{padding:7px 10px;font-size:13px;color:var(--txt);border-bottom:1px solid var(--border2);vertical-align:middle;line-height:1.5}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sky50)}

/* ── FILTER / 툴바 (목록 탭 툴바 표준) ── */
.filter-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.detail-count-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:2px 0 8px}
.detail-count{font-size:12px;font-weight:700;background:var(--sky50);color:var(--sky600);border-radius:var(--r8);padding:3px 10px;border:1px solid var(--sky100)}
html[data-theme="dark"] .detail-count{color:#fff}
.detail-count.warn{background:var(--amber50);color:var(--amber800);border-color:var(--amber100)}
.count-actions{display:flex;gap:8px;flex-shrink:0}
.search-box{flex:1;min-width:160px;padding:0 12px;height:34px;border-radius:var(--r8);border:1px solid var(--border);font-size:13px;font-family:inherit;color:var(--txt);background:var(--card);outline:none}
.search-box:focus{border-color:var(--sky)}
.tb-action-btn{height:34px;padding:0 14px;border-radius:var(--r8);font-size:12px;font-weight:700;font-family:inherit;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.tb-action-btn.tb-add{background:#185FA5}
.tb-action-btn.tb-add:hover{background:#144d87}
.tb-action-btn.tb-excel{background:#0F6E56}
.tb-action-btn.tb-excel:hover{background:#0c5a46}
.tb-action-btn.tb-delete{background:#495057}
.tb-action-btn.tb-delete:hover{background:#3a3f45}
.tb-action-btn.tb-delete.on{background:#B23A2E}
.tb-action-btn.tb-delete.on:hover{background:#962f25}
.tb-action-btn.tb-delete:disabled{opacity:.45;cursor:not-allowed}

/* ── 뱃지(터널명 등) ── */
.type-badge{display:inline-block;font-size:12px;font-weight:400;padding:3px 9px;border-radius:var(--r8);white-space:nowrap;margin:2px 0;color:#fff;border:1px solid rgba(0,0,0,.18)}
.tunnel-c0{background:#1565C0}
.tunnel-c1{background:#147A44}
.tunnel-c2{background:#5B4FBD}
.tunnel-c3{background:#A15C00}
.tunnel-c4{background:#5C5648}
/* 월간점검 탭 — 구분(6종) 뱃지 */
.gubun-c0{background:#B23A12}
.gubun-c1{background:#1565C0}
.gubun-c2{background:#A15C00}
.gubun-c3{background:#5C5648}
.gubun-c4{background:#147A44}
.gubun-c5{background:#5B4FBD}
/* 월간점검 탭 — 점검결과(양호/불량/점검요/-) 뱃지 */
.result-good{background:#0D6D63}
.result-bad{background:#D85A30}
.result-warn{background:#A15C00}
.result-none{background:#5F5E5A}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 16px;color:var(--txt3)}
.empty-icon{font-size:34px;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:700;color:var(--txt2);margin-bottom:4px}
.empty-desc{font-size:13px}

/* ── MODAL ── */
#cfgModal{display:none}
#cfgModal.modal-open{display:block}
#addModal{display:none}
#addModal.modal-open{display:block}
#detailModal{display:none}
#detailModal.modal-open{display:block}
.detail-modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.detail-modal-hd h3{font-size:15px;font-weight:700;color:var(--txt)}
/* 상세조회 키/값 표 — key 컬럼을 table-cell로 만들어 가장 긴 라벨 글자 길이에 맞춰 자동 너비 산정
   (전기설비기록처럼 라벨이 긴 탭에서 flex 고정폭 128px로는 줄바꿈이 심하게 발생하던 문제 해결) */
.detail-info-wrap{border:1.5px solid var(--border);border-radius:var(--r10);overflow:hidden;margin-bottom:14px;display:table;width:100%}
.detail-info-row{display:table-row}
.detail-info-row:nth-child(odd){background:var(--card)}
.detail-info-row:nth-child(even){background:var(--sky50)}
.detail-info-key{display:table-cell;font-size:12px;font-weight:400;color:var(--txt);white-space:nowrap;padding:10px 12px;background:rgba(55,138,221,.07);border-right:1.5px solid var(--border);border-bottom:1px solid var(--border2);vertical-align:top;line-height:1.5}
.detail-info-val{display:table-cell;font-size:13px;color:var(--txt);line-height:1.6;padding:10px 14px;word-break:break-all;border-bottom:1px solid var(--border2);vertical-align:top;width:100%}
.detail-info-row:last-child .detail-info-key,.detail-info-row:last-child .detail-info-val{border-bottom:none}
.photo-section{padding:10px 0;border-top:1px solid var(--border2)}
.photo-label{font-size:12px;font-weight:700;color:var(--txt3);margin-bottom:6px}
.photo-wrap{position:relative;background:var(--bg);border-radius:var(--r8);overflow:hidden;border:1px solid var(--border)}
.photo-wrap a{display:block}
.photo-img{width:100%;max-height:280px;object-fit:contain;display:block;cursor:zoom-in;transition:opacity .25s}
.photo-img.loading{opacity:0}
.photo-img.loaded{opacity:1}
.photo-err{display:none;padding:20px;text-align:center;font-size:12px;color:var(--txt3);line-height:1.8}
.photo-err a{color:var(--sky600);font-weight:700;text-decoration:none}
.photo-spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.photo-spinner::after{content:'';width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--sky600);border-radius:50%;animation:spin .7s linear infinite}
.detail-modal-close{background:var(--bg);border:1.5px solid var(--border);color:var(--txt2);border-radius:var(--r8);padding:6px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .12s,color .12s,border-color .12s}
.detail-modal-close:hover{background:var(--border2);color:var(--txt);border-color:var(--sky100)}
.detail-act-divider{width:1px;align-self:stretch;background:var(--border);margin:0 2px;flex-shrink:0}
.modal-select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r8);padding:10px 12px;font-size:16px;font-family:inherit;color:var(--txt);outline:none;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236B7E99' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;transition:border .18s;cursor:pointer}
.modal-select:focus{border-color:var(--sky);background-color:var(--card)}
/* select 팝업(옵션 목록)은 color-scheme만으로는 배경이 플랫폼별로 강제 반영이 안 되는 경우가 있어
   (Windows Chrome 등) option 자체에 명시적 배경·글자색을 지정 — 2026-08-06 다크모드 흰 배경/흰 글자
   실사례로 확인 후 추가. */
.modal-select option{background-color:var(--card);color:var(--txt)}
.modal-required{color:var(--coral);margin-left:2px}
.form-group-hd{font-size:13px;font-weight:800;color:var(--sky800);margin:18px 0 8px;padding-bottom:5px;border-bottom:1.5px solid var(--sky100)}
.form-group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;border:1px solid var(--border);border-radius:var(--r8);padding:10px}
.form-group-grid .modal-field{margin-bottom:0}
.add-submit-btn{background:var(--sky);border:none;color:#fff;border-radius:var(--r8);padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;min-height:40px;display:flex;align-items:center;gap:6px}
.add-submit-btn:disabled{opacity:.5;cursor:not-allowed}
.detail-act-btn{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r6);padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid transparent;white-space:nowrap;transition:opacity .12s}
.detail-edit-btn{background:var(--sky50);border-color:var(--sky100);color:var(--sky800)}
.detail-edit-btn:hover{background:var(--sky100)}
.detail-del-btn{background:var(--coral50);border-color:var(--coral100);color:var(--coral800)}
.detail-del-btn:hover{background:var(--coral100)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{background:var(--card);border-radius:var(--r20);padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.add-modal-box{max-width:560px;max-height:90vh;overflow-y:auto}
/* 신규등록/수정(#addModal)·상세보기(#detailModal) 모두 중앙 팝업 대신 우측 슬라이드인 드로어로
   표시 — 설정(#cfgModal)만 기존 중앙 모달 유지(2026-08-04 addModal 최초 적용, 2026-08-05 detailModal도
   동일 확장, work-portal 전체 앱 공통 적용). 보고서입력 탭의 .modal-inline 모드는 페이지에 얹혀 있는
   콘텐츠라 이 규칙 대상에서 제외한다(detailModal은 modal-inline 모드가 없어 해당 없음). 열기는
   modal-open 부여 직후 강제 리플로우(void offsetWidth)로 시작 상태를 확정한 뒤 drawer-in을 붙여

let CFG={workerUrl:WORKER_URL,authToken:'',authExpires:0};
(()=>{
  try{
    CFG.authToken=localStorage.getItem('wp_authToken')||'';
    CFG.authExpires=parseInt(localStorage.getItem('wp_authExpires')||'0',10)||0;
  }catch(e){}
})();
function isAuthed(){ return !!CFG.authToken && Date.now()<CFG.authExpires; }

// ── Worker 요청에 로그인 토큰 자동 첨부 + 401 시 로그인 모달 재오픈 ──
(()=>{
  const _fetch=window.fetch.bind(window);
  window.fetch=function(input,init){
    init=init||{};
    const urlStr=typeof input==='string'?input:(input&&input.url)||'';
    if(urlStr.indexOf(WORKER_URL)===0){
      const headers=new Headers(init.headers||{});
      if(CFG.authToken) headers.set('Authorization','Bearer '+CFG.authToken);
      init=Object.assign({},init,{headers});
    }
    return _fetch(input,init).then(res=>{
      if(res.status===401&&urlStr.indexOf(WORKER_URL)===0){
        CFG.authToken='';CFG.authExpires=0;
        try{localStorage.removeItem('wp_authToken');localStorage.removeItem('wp_authExpires');}catch(e){}
        openLoginModal();
      }
      return res;
    });
  };
})();

function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function fmtDate(d){ if(!d) return ''; return String(d).slice(0,10); }
function fmtDateMD(d){ const s=fmtDate(d); if(!s) return ''; return `${parseInt(s.slice(5,7),10)}/${parseInt(s.slice(8,10),10)}`; }
function fmtWon(n){ return (Number(n)||0).toLocaleString('ko-KR',{maximumFractionDigits:2}); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// 제목 = "YYYY년 M월 {접미어}" — 터널명 대신 해당 레코드의 날짜(YYYY-MM-DD)로 월 구분(월간 보고 체계라 터널명보다 유용)
function titleWithMonth(dateStr, suffix){
  if(!dateStr) return null;
  const y=dateStr.slice(0,4), m=parseInt(dateStr.slice(5,7),10);
  if(!y || !m) return null;
  return `${y}년 ${m}월 ${suffix}`;
}
// ── 모달 드래그 이동 ──
function makeModalDraggable(box, handle){
  if(!box||!handle) return;
  if(handle.dataset.dragBound) return; // initDraggableModals()가 모달을 열 때마다 재호출되며 동일 handle에 리스너가 계속 누적되는 것 방지
  handle.dataset.dragBound='1';
  handle.style.cursor='move';
  handle.style.userSelect='none';
  let dragging=false, startX=0, startY=0, startLeft=0, startTop=0;
  function onDown(e){
    const p=e.touches?e.touches[0]:e;
    const rect=box.getBoundingClientRect();
    dragging=true;
    startX=p.clientX; startY=p.clientY;
    startLeft=rect.left; startTop=rect.top;
    box.style.position='fixed';
    box.style.left=startLeft+'px';
    box.style.top=startTop+'px';
    box.style.width=rect.width+'px'; /* width:100%가 fixed 전환 시 뷰포트 기준으로 재계산되며 좁은 화면에서 모달이 순간 넓어져
      헤더 우측의 닫기 버튼이 손가락/커서 아래에서 옆으로 밀려나 탭이 무산되는 문제 방지 */
    box.style.margin='0';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onUp);
  }
  function onMove(e){
    if(!dragging) return;
    const p=e.touches?e.touches[0]:e;
    if(e.touches) e.preventDefault();
    box.style.left=(startLeft+(p.clientX-startX))+'px';
    box.style.top=(startTop+(p.clientY-startY))+'px';
  }
  function onUp(){
    dragging=false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:true});
}
function resetModalDragPos(modalId){
  const box=document.querySelector('#'+modalId+' .modal-box');
  if(!box) return;
  box.style.position=''; box.style.left=''; box.style.top=''; box.style.margin='';
}
function initDraggableModals(){
  document.querySelectorAll('.modal-box').forEach(box=>{
    if(box.closest('#addModal') || box.closest('#detailModal')) return; // 우측 고정 드로어는 드래그 이동 대상에서 제외(2026-08-04, 2026-08-05 detailModal도 추가)
    const handle=box.querySelector('.modal-title, .detail-modal-hd');
    if(handle) makeModalDraggable(box, handle);
  });
}

function syncThemeOptUI(){
  const cur=document.documentElement.getAttribute('data-theme')||'dark';

// ── Notion 값 추출 헬퍼 ──
function getText(p){
  if(!p) return '';
  if(p.type==='title') return (p.title||[]).map(t=>t.plain_text||'').join('')||'';
  if(p.type==='rich_text') return (p.rich_text||[]).map(t=>t.plain_text||'').join('')||'';
  if(p.type==='select') return p.select?.name||'';
  if(p.type==='number') return String(p.number??'');
  return '';
}
function getNum(p){
  if(!p) return 0;
  if(p.type==='number') return Number(p.number)||0;
  return parseFloat(getText(p))||0;
}
function getDateStr(p){
  if(!p) return '';
  if(p.type==='date') return p.date?.start ? p.date.start.slice(0,10) : '';
  return getText(p).trim().slice(0,10);
}
function buildPropValue(type, rawValue){
  const empty=(rawValue===undefined||rawValue===null||String(rawValue).trim()==='');
  if(type==='title') return empty?{title:[]}:{title:[{text:{content:String(rawValue)}}]};
  if(type==='text') return empty?{rich_text:[]}:{rich_text:[{text:{content:String(rawValue)}}]};
  if(type==='select') return empty?{select:null}:{select:{name:String(rawValue)}};
  if(type==='date') return empty?{date:null}:{date:{start:String(rawValue)}};
  if(type==='number') return empty?{number:null}:{number:parseFloat(rawValue)||0};
  if(type==='file') return {files:(rawValue||[]).map(f=>({name:f.name||'사진',type:'external',external:{url:f.url}}))};
  return null;
}
function getFiles(p){
  if(!p || p.type!=='files') return [];
  return (p.files||[]).map(f=>({name:f.name||'', url:(f.external&&f.external.url)||(f.file&&f.file.url)||''})).filter(f=>f.url);
}
function parseRecord(tabDef, page){
  const props=page.properties||{};
  const rec={id:page.id};
  dataFields(tabDef).forEach(f=>{
    const p=props[f.key];
    if(f.type==='number') rec[f.key]=getNum(p);
    else if(f.type==='date') rec[f.key]=getDateStr(p);
    else if(f.type==='file') rec[f.key]=getFiles(p);
    else rec[f.key]=getText(p).trim();
  });
  return rec;
}

function fetchNotion(dbId, body){
  return fetch(CFG.workerUrl+'/v1/databases/'+dbId+'/query',{
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  }).then(r=>{ if(!r.ok) return r.text().then(t=>{ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); });
}

  let pages=[], cursor=null, guard=0;
  do{
    const reqBody=cursor ? Object.assign({},body,{start_cursor:cursor}) : body;
    const data=await fetchNotion(dbId, reqBody);
    pages=pages.concat(data.results||[]);
    cursor = data.has_more ? data.next_cursor : null;
    guard++;
  } while(cursor && guard<50);
  return pages;
}
function notionFetch(path, method, body){
  return fetch(CFG.workerUrl+path,{ method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) })
    .then(r=>{ if(!r.ok) return r.text().then(t=>{ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); });
}
// 다건 Notion 쓰기(전기설비기록 41개 자식 등)를 동시에 몇 개씩 묶어서 처리 — 완전 순차(느림)와 완전 동시(429 위험) 사이 절충
function runWithConcurrency(tasks, limit){
  return new Promise((resolve, reject)=>{
    const results=new Array(tasks.length);
    let idx=0, active=0, doneCount=0, failed=false;
    function pump(){
      if(failed) return;
      while(active<limit && idx<tasks.length){
        const cur=idx++;
        active++;
        tasks[cur]().then(v=>{
          results[cur]=v; active--; doneCount++;
          if(doneCount===tasks.length) resolve(results);
          else pump();
        }).catch(e=>{ failed=true; reject(e); });
      }
    }
    if(!tasks.length) resolve(results);
    else pump();
  });
}

async function loadTabData(tabId){
  const tabDef=getTabDef(tabId);
  if(!tabDef || !tabDef.fields) return;
  if(!isAuthed()){ openLoginModal(); return; }
  const st=TAB_STATE[tabId];
  if(st.loading) return;
  st.loading=true;
  setSyncing(true);
  try{
    const body={page_size:100};
    if(tabDef.dateKey){
      body.sorts=[{property:tabDef.dateKey, direction:'descending'}];
      // 점검사진 탭 — 일자(내림차순) 다음으로 터널명(오름차순)·번호(오름차순) 순으로 정렬
      // (2026-07-29 사용자 요청 — 터널별 순번 전환 후 같은 날짜 여러 건이 뒤섞여 보이던 문제).
      if(tabId==='photo') body.sorts.push({property:'터널명', direction:'ascending'}, {property:'번호', direction:'descending'});
    }
    const pages=await fetchAllPages(tabDef.dbId, body);
    st.records=pages.map(p=>parseRecord(tabDef,p));
    st.loaded=true;
    st.loadFailed=false;
    if(tabId==='elecinsp'){
      try{
        const bad=st.records.filter(r=>r['점검결과']==='불량').length;
        const ratio=st.records.length>0 ? (st.records.length-bad)/st.records.length : 1;
        localStorage.setItem('portal_summary_monthlyTeam', JSON.stringify({totalCount:st.records.length, ratio, updatedAt:Date.now()}));
      }catch(e){}
    }
    applyLatestFilterDefault(tabId);
    renderTabTable(tabId);
    updateLastUpdate();
  }catch(e){
    st.loadFailed=true;
    toast('데이터 로드 실패: '+e.message);
    console.error(e);
  }finally{
    st.loading=false;
    setSyncing(false);
  }
}

function toggleDd(menuId,btnId){
  const menu=document.getElementById(menuId),btn=document.getElementById(btnId);
  if(!menu||!btn) return;
  if(menu.classList.contains('open')){ closeDd(menuId,btnId); }
  else {
    // .report-toolbar는 가로 스크롤(overflow-x:auto)이 걸려 있는데 CSS 스펙상 overflow-y도
    // 같이 auto가 돼 absolute 팝업이 표에 가려 잘려 보인다 — 열릴 때 좌표를 계산해 position:fixed로
    // 붙여서 스크롤 컨테이너의 clip 영향을 아예 안 받게 한다(안전관리 앱과 동일 수정, 2026-07-31).
    if(btn.closest('.report-toolbar')){

      menu.style.position='fixed';
      menu.style.top=(r.bottom+6)+'px';
      menu.style.left=r.left+'px';
    }
    menu.classList.add('open'); btn.classList.add('active');
  }
}

  if(f.type==='number') return `<td class="r">${fmtWon(r[key])}</td>`;

  const set=DELETE_SELECTED[tabId]||(DELETE_SELECTED[tabId]=new Set());
  recs.forEach(r=>{ if(checked) set.add(r.id); else set.delete(r.id); });
  renderTabTable(tabId);
  updateDeleteConfirmLabel(tabId);
}
function toggleRowSelect(tabId, id, checked){
  const set=DELETE_SELECTED[tabId]||(DELETE_SELECTED[tabId]=new Set());
  if(checked) set.add(id); else set.delete(id);
  updateDeleteConfirmLabel(tabId);
  syncSelectAllCheckbox(tabId, getVisibleRecords(tabId));
}
async function deleteSelectedRows(tabId){
  const set=DELETE_SELECTED[tabId];
  if(!set || !set.size) return;
  if(!confirm(set.size+'건을 삭제(휴지통 이동)할까요? 이 작업은 되돌릴 수 없습니다.')) return;
  const ids=[...set];
  const confirmBtn=document.getElementById('delConfirmBtn_'+tabId);
  if(confirmBtn) confirmBtn.disabled=true;
  let done=0;
  const tasks=ids.map(id=>()=>notionFetch('/v1/pages/'+id,'PATCH',{in_trash:true}).then(()=>{
    done++;
    if(confirmBtn) confirmBtn.textContent='삭제 중... ('+done+'/'+ids.length+')';
  }));
  try{
    await runWithConcurrency(tasks, 6);
    const arr=TAB_STATE[tabId].records;
    ids.forEach(id=>{ const idx=arr.findIndex(r=>r.id===id); if(idx>=0) arr.splice(idx,1); });
    toast(ids.length+'건 삭제되었습니다.');
    toggleDeleteMode(tabId);
  }catch(e){
    alert('삭제 실패: '+e.message+' — 일부는 이미 삭제되었을 수 있어 새로고침 후 확인해주세요.');
    if(confirmBtn) confirmBtn.disabled=false;
    updateDeleteConfirmLabel(tabId);
    console.error(e);
  }
}

function buildPhotoThumbs(files, maxShow){
  if(!files || !files.length) return '<span style="color:var(--txt3)">-</span>';
  const shown=files.slice(0,maxShow||4);
  const html=shown.map(f=>
    `<a href="${esc(f.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">`
    +`<img src="${esc(f.url)}" alt="사진" style="width:40px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--border);margin:1px;display:inline-block;vertical-align:middle" onerror="this.style.display='none'">`
    +`</a>`
  ).join('');
  const more = files.length>shown.length ? `<span style="font-size:11px;color:var(--txt3);margin-left:4px">+${files.length-shown.length}</span>` : '';
  return html+more;
}

    const cascadeCall = f.cascadeTrigger ? `;refreshAllCascadeSelects('${tabId}')` : '';
    const extraCall = f.extraOnChange ? `;${f.extraOnChange}` : '';
    return `<div class="modal-field">${label}
      <select id="${id}" class="modal-select" onchange="onSelectChange(this,'${id}c')${cascadeCall}${extraCall}">
        <option value="">선택</option>

        ${opts}
      </select>
      <input id="${id}c" class="modal-input" type="text" placeholder="직접 입력" style="display:${isCustom?'':'none'};margin-top:6px" value="${isCustom?esc(curVal):''}"/>

// 입력폼탭 전체 입력창 채움 표시(.rp-filled, 2026-08-03) — safety 앱(monthly-inspection.html)과
// 동일 패턴. #reportPaper를 MutationObserver로 감시해 어떤 방식으로 그려지든 채움 여부를 자동 갱신.
function markReportFilled(el){
  if(!el || !el.classList) return;
  const tag=el.tagName;
  if(tag!=='INPUT' && tag!=='SELECT' && tag!=='TEXTAREA') return;
  if(el.type==='file') return;
  const v=el.value;
  el.classList.toggle('rp-filled', !!v && v!=='__custom__');
}
function markReportFilledAll(){
  const rp=document.getElementById('reportPaper');
  if(!rp) return;
  rp.querySelectorAll('input,select,textarea').forEach(markReportFilled);
}
(function initReportFilledTracking(){
  const rp=document.getElementById('reportPaper');
  if(!rp) return;
  rp.addEventListener('input', e=>markReportFilled(e.target));
  rp.addEventListener('change', e=>markReportFilled(e.target));
  let scheduled=false;
  const observer=new MutationObserver(()=>{
    if(scheduled) return;
    scheduled=true;
    setTimeout(()=>{ scheduled=false; markReportFilledAll(); }, 0);
  });
  observer.observe(rp, {childList:true, subtree:true});
})();
// 캐스케이딩 select 공용 엔진 — dependsOn 필드들의 현재값을 optionsFn에 넘겨 옵션을 재계산.
// (월간점검 구분+설비명→점검내용, 변압기온도 변압기종류→측정지점, 전력사용량 터널명→제목 등 재사용)
function refreshCascadeSelect(tabId, contentIdx, initialValue){
  const tabDef=getTabDef(tabId);
  if(!tabDef) return;
  const f=tabDef.fields[contentIdx];
  if(!f || f.uiType!=='cascade-select') return;
  const sel=document.getElementById('ff_'+contentIdx);
  if(!sel) return;
  const ci=document.getElementById('ff_'+contentIdx+'c');
  const depValues={};
  (f.dependsOn||[]).forEach(depKey=>{
    const depIdx=tabDef.fields.findIndex(x=>x.key===depKey);
    depValues[depKey]=depIdx>=0 ? getFieldValue(tabDef.fields[depIdx], depIdx) : '';
  });
  const opts=f.optionsFn(depValues);
  const isDependencyRefresh = initialValue===undefined; // cascadeTrigger 필드 변경으로 재계산되는 호출인지(신규/수정 최초 로드는 항상 initialValue를 명시적으로 넘김)
  let curVal = initialValue!==undefined ? initialValue : (sel.value==='__custom__' ? (ci?ci.value:'') : sel.value);
  curVal = (curVal===undefined||curVal===null) ? '' : String(curVal); // number 타입 필드(배율 등) 수정 시 r[key]가 숫자로 들어와도 옵션 문자열과 비교되도록 통일
  if(opts.length===1){
    // 의존 필드(터널명 등) 변경으로 재계산되는 시점엔 이전 값이 새 터널과 무관하므로 새 후보로 스냅.
    // 최초 신규 입력 로드 때는 값이 비어있을 때만 자동 채움. 수정 모드 최초 로드는 저장된 값을 그대로 보존.
    if(isDependencyRefresh ? curVal!==opts[0] : !curVal) curVal=opts[0];
  } else if(isDependencyRefresh && opts.length===0 && curVal){
    curVal=''; // 새 의존값에 해당하는 후보가 아예 없으면(예: 남정5터널은 발전/태양광 스펙 없음) 이전 터널의 값을 지움
  }
  const isCustom = !!curVal && !opts.includes(curVal);
  // emptyHintFn — 옵션이 0개인 이유가 "아직 의존값을 안 골라서"가 아니라 "이 의존값 조합엔 원래
  // 후보가 없어서"인 경우 문구를 다르게 보여줘야 할 때 씀(예: 월간점검 설비명이 구분="기타"/
  // "태양광발전설비"일 때 "먼저 구분을 선택하세요"가 아니라 "이 구분은 설비명이 없습니다"로,
  // 2026-07-23). 없으면 기존 f.emptyHint 고정 문구 유지.
  const emptyOptText = opts.length ? '선택' : (f.emptyHintFn ? f.emptyHintFn(depValues) : (f.emptyHint||'선택'));
  sel.innerHTML = `<option value="">${esc(emptyOptText)}</option>`
    + `<option value="__custom__"${isCustom?' selected':''}>직접입력</option>`
    + opts.map(o=>`<option value="${esc(o)}"${curVal===o?' selected':''}>${esc(o)}</option>`).join('');
  if(!isCustom && opts.includes(curVal)) sel.value=curVal;
  if(ci){
    if(isCustom){ ci.style.display=''; ci.value=curVal; } else { ci.style.display='none'; ci.value=''; }
  }
  // 의존값에 따라 안내 문구 자체를 바꿔야 하는 필드용(예: 월간점검 설비명이 구분="기타"/"태양광
  // 발전설비"일 때 "입력하지 마세요"로 바뀌는 경우, 2026-07-23) — hintFn 없으면 기존 고정 문구 유지.
  const hintEl=document.getElementById('ff_'+contentIdx+'_hint');
  if(hintEl){
    hintEl.textContent = f.hintFn ? f.hintFn(depValues)
      : ((f.dependsOn||[]).length ? f.dependsOn.join('·')+' 선택에 따라 표준 목록이 좁혀집니다.' : '최근 입력값 중에서 선택하거나 직접 입력하세요.');
  }
}
// cascadeTrigger 필드의 onchange에서 호출 — 해당 탭의 캐스케이딩 select 전부를 재계산
function refreshAllCascadeSelects(tabId){
  const tabDef=getTabDef(tabId);
  if(!tabDef) return;
  tabDef.fields.forEach((f,idx)=>{ if(f.uiType==='cascade-select') refreshCascadeSelect(tabId, idx); });
  // 전기시설점검 신규등록 체크리스트는 터널별로 실제 적용 항목이 달라(TEAM_TUNNEL_ITEM_OVERRIDES)
  // 터널명이 바뀌면 구분 체크박스·점검항목 체크리스트를 전부 다시 그려야 한다(2026-08-12).
  if(tabId==='elecinsp' && document.getElementById('elecinspGubunWrap')){
    document.getElementById('elecinspGubunWrap').innerHTML=buildElecinspGubunHtml();
    refreshElecinspChecklist();
  }
}
// 전기시설점검 신규등록 — "구분" 값이 바뀔 때마다 그 구분의 표준 점검항목 전체를 기본 체크된
// 상태로 다시 그린다(체크 해제로 이번엔 해당 없는 항목만 뺄 수 있음).
// 신규등록 전용 "구분" 다중선택 — 한 터널·날짜에 여러 구분이 함께 점검되는 실사용 패턴 반영(2026-07-25)
// 2026-08-12: 터널별로 실제 없는 구분(예: 단터널의 관리동설비·터널진입차단설비)은 체크박스 자체를
// 숨긴다 — teamGubunApplicable 기준.

// 업로드 파일 1개당 용량 제한(2026-07-27 사용자 요청) — 이미지는 캔버스로 재인코딩해 자동 압축,
// 압축이 불가능한 파일(문서 등)이나 압축 후에도 초과하는 이미지는 업로드를 막고 안내한다.
const UPLOAD_MAX_BYTES = 500*1024;
const UPLOAD_MAX_LABEL = '500KB';
function compressImageToLimit(file, maxBytes){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/') || file.size<=maxBytes){ resolve(file); return; }
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.naturalWidth, h=img.naturalHeight, quality=0.85, attempts=0;
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d');
      const step=()=>{
        attempts++;
        canvas.width=w; canvas.height=h;
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob){ reject(new Error('이미지 압축 실패')); return; }
          if(blob.size<=maxBytes){
            resolve(new File([blob], (file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'}));
            return;
          }
          if(attempts>=8){ reject(new Error('이미지를 '+UPLOAD_MAX_LABEL+' 이하로 압축하지 못했습니다. 더 작은 사진을 선택해주세요.')); return; }
          if(quality>0.4) quality-=0.15; else { w=Math.round(w*0.75); h=Math.round(h*0.75); }
          step();
        }, 'image/jpeg', quality);
      };
      step();
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')); };
    img.src=url;
  });
}
// ── 점검사진 업로드 (overtime-work 앱 다중 첨부파일 패턴 재사용, R2 monthly-inspection 폴더) ──
function uploadInspectionPhoto(input, fieldId){
  const files=Array.from(input.files||[]);
  if(!files.length) return;
  const statusEl=document.getElementById(fieldId+'_status');
  if(!isAuthed()){
    if(statusEl){ statusEl.textContent='⚠ 로그인 필요'; statusEl.style.color='var(--coral)'; }
    return;
  }
  let remaining=files.length;
  if(statusEl){ statusEl.textContent='업로드 중... (0/'+files.length+')'; statusEl.style.color=''; }
  // 선택한 순서대로 결과 슬롯을 미리 잡아두고, 전부 완료된 뒤 순서대로 _photoFiles에 반영한다
  // (병렬 업로드라 네트워크 응답 순서가 선택 순서와 다를 수 있어, push를 개별 완료 시점에 하면 표시 순서가 어긋남)
  const results=new Array(files.length).fill(null);
  let done=0;
  files.forEach((file,i)=>{
    compressImageToLimit(file, UPLOAD_MAX_BYTES).then(outFile=>{
      if(outFile.size>UPLOAD_MAX_BYTES) throw new Error('파일 용량 초과 (최대 '+UPLOAD_MAX_LABEL+')');
      const formData=new FormData();
      formData.append('file', outFile);
      formData.append('app', 'monthly-inspection-team');
      return fetch(CFG.workerUrl+'/upload', { method:'POST', body:formData })
        .then(r=>{ if(!r.ok) return r.text().then(t=>{ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); })
        .then(data=>{ results[i]={ url:data.url, name:file.name }; });
    })
      .catch(e=>{
        toast('사진 업로드 실패('+file.name+'): '+e.message);
        console.error(e);
      })
      .finally(()=>{
        done++;
        if(statusEl) statusEl.textContent='업로드 중... ('+done+'/'+files.length+')';
        if(done===files.length){
          results.forEach(r=>{ if(r) _photoFiles.push(r); });
          if(statusEl){ statusEl.textContent=_photoFiles.length?('총 '+_photoFiles.length+'장 첨부됨'):'첨부파일 없음'; statusEl.style.color=''; }
          renderPhotoFileList(fieldId);
        }
      });
  });
  input.value='';
}
function renderPhotoFileList(fieldId){
  const wrap=document.getElementById(fieldId+'_list');
  const statusEl=document.getElementById(fieldId+'_status');
  if(statusEl) statusEl.textContent=_photoFiles.length?('총 '+_photoFiles.length+'장 첨부됨'):'첨부파일 없음';
  if(!wrap) return;
  wrap.innerHTML=_photoFiles.map((f,i)=>
    `<div style="position:relative">
      <img src="${esc(f.url)}" alt="사진" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border)">
      <button type="button" onclick="removePhotoFile(${i},'${fieldId}')" aria-label="사진 삭제" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--coral);color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer">✕</button>
    </div>`
  ).join('');

}
// 번호는 터널별로 그 달 안에서 1부터 이어지는 순번 — 카드에서 터널명을 고르거나 바꿀 때마다
// 그 터널의 다음 번호를 자동 채운다(이미 저장된 레코드+현재 폼의 다른 카드 모두 참고, 2026-08-03
// 사용자 요청 — 예: 남정3터널 카드 다음에 남정4터널을 고르면 다시 1번부터 시작).
function nextNumberForTunnel(tunnel, excludeKey){
  const ym=REPORT_SEL.year+'-'+REPORT_SEL.month;
  const savedNums=(TAB_STATE.photo.records||[]).filter(r=>r['터널명']===tunnel && (r['일자']||'').startsWith(ym))
    .map(r=>parseInt(r['번호'],10)).filter(n=>!isNaN(n));
  const rowNums=_photoMultiRows.filter(r=>r.key!==excludeKey && r.tunnel===tunnel)
    .map(r=>parseInt(r.num,10)).filter(n=>!isNaN(n));
  const all=savedNums.concat(rowNums);
  return all.length ? Math.max(...all)+1 : 1;
}
// 사진설명 후보 — 전월(가장 최근 등록월) 같은 터널에서 쓰인 사진설명을 드롭다운으로 제안한다
// (2026-08-03 사용자 요청). 안전관리 앱은 터널×번호 조합으로 좁히지만, 점검팀은 번호가 카테고리가
// 아니라 단순 순번이라 번호까지 맞추면 오히려 안 맞는 제안이 나온다 — 터널만 기준으로 삼는다.
function photoDescOptionsTeam(tunnel){
  if(!tunnel) return [];
  const ym=REPORT_SEL.year+'-'+REPORT_SEL.month;
  const recs=(TAB_STATE.photo.records||[]).filter(r=>r['터널명']===tunnel && (r['일자']||'').slice(0,7)<ym);
  if(!recs.length) return [];
  const lastYm=recs.reduce((a,r)=>{ const y=(r['일자']||'').slice(0,7); return (!a||y>a)?y:a; }, null);
  const seen=new Set();
  recs.filter(r=>(r['일자']||'').startsWith(lastYm)).sort((a,b)=>(parseInt(a['번호'],10)||0)-(parseInt(b['번호'],10)||0))
    .forEach(r=>{ if(r['사진설명']) seen.add(r['사진설명']); });
  return Array.from(seen);
}
// 모달을 열 때마다 빈 칸으로 시작하면 이미 등록해둔 사진도 매번 새로 입력하는 것처럼 보인다
// (안전관리 앱과 동일한 문제, 2026-08-10). 점검팀은 REPORT_SEL에 터널 구분이 없어(전체 터널
// 월간 보고서) 이번 달 전체 터널의 기존 레코드를 터널명순(표준 순서)·일자 오름차순으로 불러와
// 카드로 만든다 — 실제 "보고서 생성" 출력물(buildPhotoTeamReportRows)도 터널별로 배치되므로
// 입력 화면에서부터 같은 순서로 보여야 계속 데이터를 추가하는 중에도 육안 확인이 쉽다(2026-08-12).
function buildPhotoMultiRowsFromExisting(){
  const ym=REPORT_SEL.year+'-'+REPORT_SEL.month;
  const recs=(TAB_STATE.photo.records||[]).filter(r=>(r['일자']||'').startsWith(ym))
    .sort((a,b)=>{
      const ta=TUNNEL_OPTIONS_STD.indexOf(a['터널명']), tb=TUNNEL_OPTIONS_STD.indexOf(b['터널명']);
      if(ta!==tb) return (ta<0?999:ta)-(tb<0?999:tb);
      if((a['일자']||'')!==(b['일자']||'')) return (a['일자']||'').localeCompare(b['일자']||'');
      return (parseInt(a['번호'],10)||0)-(parseInt(b['번호'],10)||0);
    });
  // 등록된 기록이 하나도 없어도 빈 화면 대신 바로 입력을 시작할 수 있게 빈 카드를 기본으로
  // 보여준다(2026-08-03) — 몇 장을 보여줄지는 가장 최근에 실제 등록이 있었던 달의 카드 수를
  // 그대로 참고한다(예: 이번 달이 비어있고 지난달에 10장을 등록했으면 10장짜리 빈 카드로 시작).
  // 내용(터널명·일자·사진설명)은 채우지 않고 개수만 참고한다 — 데이터가 아예 없으면 1장.
  const allYms=[...new Set((TAB_STATE.photo.records||[]).map(r=>(r['일자']||'').slice(0,7)).filter(Boolean))].filter(y=>y<ym).sort();
  const lastYm=allYms[allYms.length-1];
  const historyCount=lastYm ? (TAB_STATE.photo.records||[]).filter(r=>(r['일자']||'').startsWith(lastYm)).length : 0;
  const targetCount=Math.max(historyCount,1);
  // 이번 달에 이미 일부 등록된 상태에서도(recs.length>0) 나머지 미입력 카드가 targetCount까지
  // 그대로 이어서 보이도록, 기존 레코드를 채운 카드 뒤에 빈 카드를 이어붙인다 — 예전엔 recs가
  // 하나라도 있으면 그 개수만큼만 반환해서 나머지 미입력 카드가 전부 사라지는 버그가 있었음
  // (2026-08-05 사용자 재신고: 42장 기본에서 4장만 등록하니 나머지 38장이 사라지고 "+행 추가"를
  // 일일이 눌러야 했음 — 안전관리 앱은 터널당 고정 6칸이라 이 문제가 없었던 것과 대조하여 발견).
  const filledRows=recs.map(r=>{
    const row=newPhotoMultiRow(r['번호']!=null?String(r['번호']):'', r['사진설명']||'');
    row.tunnel=r['터널명']||'';
    row.date=r['일자']||'';
    row.files=(r['점검사진']||[]).slice(0,1);
    return row;
  });
  const extraCount=Math.max(targetCount-filledRows.length,0);
  const extraRows=Array.from({length:extraCount}, (_,i)=>newPhotoMultiRow(String(filledRows.length+i+1),''));
  return filledRows.concat(extraRows);
}
// 터널명·일자가 더 이상 상단 공용 필드가 아니라 카드마다 개별 입력이라(2026-08-10, 안전관리 앱과
// 동일한 카드 UI로 전환). 기준 터널명·일자 선택 후 불러오는 편의 기능(전기시설점검 불러오기·
// 최근월 불러오기)은 카드 UI와 중복돼 혼란만 줘서 제거(2026-08-03) — 카드마다 터널명·일자를
// 직접 입력하고 "+ 행 추가"로 새 카드를 늘리는 안전관리 앱과 동일한 방식으로 단순화.
function buildPhotoMultiHtml(){
  return `<div class="modal-field">
    <label class="modal-label">사진대지 <span class="modal-required">*</span></label>
    <div id="photoMultiRowsList" style="margin-top:8px"></div>
    <button type="button" class="tb-action-btn tb-add" style="margin-top:10px" onclick="addPhotoMultiRow()">+ 행 추가</button>
  </div>`;
}
function renderPhotoMultiRows(){
  const wrap=document.getElementById('photoMultiRowsList');
  if(!wrap) return;

    wrap.innerHTML='<div class="modal-hint">"+ 행 추가"로 새 카드를 만드세요.</div>';

  }
  const tunnelOpts=TUNNEL_OPTIONS_STD;
  // 안전관리 앱 사진대지 카드와 동일한 형태로 배치(2026-08-10) — 다만 점검팀은 번호가 고정 6칸이
  // 아니라 터널별로 이어지는 임의 개수라 카드 수가 가변이다. 사진은 슬롯당 1장(교체 방식)으로 단순화.
  wrap.innerHTML=`<div id="photoMultiGridRow" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,340px));gap:10px">${_photoMultiRows.map(row=>{
    const tunnelOptsHtml=tunnelOpts.map(o=>`<option value="${esc(o)}"${row.tunnel===o?' selected':''}>${esc(o)}</option>`).join('')
      + (row.tunnel && !tunnelOpts.includes(row.tunnel) ? `<option value="${esc(row.tunnel)}" selected>${esc(row.tunnel)}</option>` : '');
    const descOptsArr=photoDescOptionsTeam(row.tunnel);
    const isCustomDesc=row.descCustom || (!!row.desc && !descOptsArr.includes(row.desc));
    const descOpts=descOptsArr.map(d=>`<option value="${esc(d)}"${!isCustomDesc&&row.desc===d?' selected':''}>${esc(d)}</option>`).join('');
    const accent=tunnelColor(row.tunnel);
    const photo=row.files[0];
    const photoArea = photo
      ? `<div style="position:relative;width:100%;aspect-ratio:4/3;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer" onclick="document.getElementById('pmf_${row.key}').click()">
          <img src="${esc(photo.url)}" alt="사진" style="width:100%;height:100%;object-fit:cover;display:block">
          <div style="position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;text-align:center;padding:5px 0">사진 변경</div>
          <button type="button" onclick="event.stopPropagation();removePhotoMultiFile(${row.key},0)" aria-label="사진 삭제" style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer">✕</button>
        </div>`
      : `<button type="button" class="tb-action-btn tb-add" style="width:100%;padding:16px 0;justify-content:center" onclick="document.getElementById('pmf_${row.key}').click()">사진 선택</button>`;
    return `<div style="border:1px solid var(--border);border-left:4px solid ${accent};border-radius:var(--r8);padding:10px;position:relative">
      <button type="button" onclick="removePhotoMultiRow(${row.key})" title="행 삭제" aria-label="행 삭제" style="position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:transparent;color:var(--coral);border:1px solid var(--border);cursor:pointer;flex-shrink:0">✕</button>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${accent};flex-shrink:0"></span>
        <span id="pmn_${row.key}" style="font-weight:800;font-size:13px">#${esc(row.num||'-')}</span>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;min-width:0">
          <div class="pm-card-label">터널명</div>
          <select class="modal-select" style="width:100%;padding:8px" onchange="_photoMultiSetTunnel(${row.key},this.value)">
            <option value="">선택</option>
            ${tunnelOptsHtml}
          </select>
        </div>
        <div style="flex:1;min-width:0">
          <div class="pm-card-label">일자</div>
          <input type="date" class="modal-input" style="width:100%" value="${esc(row.date||'')}" onchange="_photoMultiSetDate(${row.key},this.value)"/>
        </div>
      </div>
      <div class="pm-card-label" style="margin-top:8px">번호</div>
      <input type="number" class="modal-input" style="width:100%" value="${esc(row.num)}" oninput="_photoMultiSet(${row.key},'num',this.value);document.getElementById('pmn_${row.key}').textContent='#'+(this.value||'-')"/>
      <div class="pm-card-label" style="margin-top:8px">사진설명</div>
      <select class="modal-select" style="width:100%;padding:8px" onchange="_photoMultiDescChange(${row.key},this)">
        <option value="">선택</option>
        <option value="__custom__"${isCustomDesc?' selected':''}>직접입력</option>
        ${descOpts}
      </select>
      <input type="text" class="modal-input" id="pmfdescc_${row.key}" placeholder="직접 입력" style="display:${isCustomDesc?'':'none'};margin-top:6px;padding:8px;width:100%" value="${isCustomDesc?esc(row.desc):''}" oninput="_photoMultiSet(${row.key},'desc',this.value)"/>
      <div class="pm-card-label" style="margin-top:8px">점검사진</div>
      ${photoArea}
      <input type="file" id="pmf_${row.key}" accept="image/*" style="display:none" onchange="uploadPhotoMultiFile(this,${row.key})"/>
    </div>`;
  }).join('')}</div>`;
  syncTeamPhotoFormWidth();
}
// 점검사진 입력폼 폭 정렬 — 카드 그리드가 실제로 몇 칸씩 배치되는지(현재 폭 기준 자연스러운 줄바꿈
// 결과)를 기준 카드로 삼아 photoMultiWrap 폭을 맞춘다(안전관리 앱과 동일 패턴, 2026-08-10 —
// "등록 현황" 미리보기 그리드를 없애면서 그 그리드를 기준으로 삼던 예전 방식 대체).
function syncTeamPhotoFormWidth(){
  const gridRow=document.getElementById('photoMultiGridRow');
  const photoWrap=document.getElementById('photoMultiWrap');
  if(!gridRow || !photoWrap || !gridRow.children.length) return;
  const contLeft=gridRow.getBoundingClientRect().left;
  let maxRight=0;
  Array.from(gridRow.children).forEach(ch=>{ maxRight=Math.max(maxRight, ch.getBoundingClientRect().right-contLeft); });
  if(maxRight<=0) return;
  photoWrap.style.maxWidth=`min(${Math.ceil(maxRight)}px, 100%)`;
}
function _photoMultiSet(key, field, val){
  const row=_photoMultiRows.find(r=>r.key===key);
  if(row) row[field]=val;
}
// 터널명순(표준 순서)·일자 오름차순 정렬 — buildPhotoMultiRowsFromExisting의 초기 정렬과 동일한
// 기준. 카드에서 터널명·일자를 고르거나 바꿀 때마다 다시 불러 카드가 해당 터널 위치로 즉시
// 이동해 보이게 한다(2026-08-12 사용자 요청 — 계속 데이터를 추가하는 중에도 터널별로 한눈에 확인).
function sortPhotoMultiRows(){
  _photoMultiRows.sort((a,b)=>{
    const ta=TUNNEL_OPTIONS_STD.indexOf(a.tunnel), tb=TUNNEL_OPTIONS_STD.indexOf(b.tunnel);
    if(ta!==tb) return (ta<0?999:ta)-(tb<0?999:tb);
    if(a.date!==b.date) return (a.date||'').localeCompare(b.date||'');
    return (parseInt(a.num,10)||0)-(parseInt(b.num,10)||0);
  });
}
function _photoMultiSetTunnel(key, val){
  const row=_photoMultiRows.find(r=>r.key===key);
  if(!row) return;
  row.tunnel=val;
  if(val) row.num=String(nextNumberForTunnel(val, key));
  sortPhotoMultiRows();
  renderPhotoMultiRows();
}
function _photoMultiSetDate(key, val){
  const row=_photoMultiRows.find(r=>r.key===key);
  if(!row) return;
  row.date=val;
  sortPhotoMultiRows();
  renderPhotoMultiRows();
}
function _photoMultiDescChange(key, selEl){
  const row=_photoMultiRows.find(r=>r.key===key);
  if(!row) return;
  if(selEl.value==='__custom__'){
    row.descCustom=true;
    renderPhotoMultiRows();
    document.getElementById('pmfdescc_'+key)?.focus();
  } else {
    row.descCustom=false;
    row.desc=selEl.value;
  }
}
function addPhotoMultiRow(){
  const nums=_photoMultiRows.map(r=>parseInt(r.num,10)).filter(n=>!isNaN(n));
  const nextNum=nums.length?Math.max(...nums)+1:(_photoMultiRows.length+1);
  const row=newPhotoMultiRow(String(nextNum), '');
  _photoMultiRows.push(row);
  renderPhotoMultiRows();
}
function removePhotoMultiRow(key){
  _photoMultiRows=_photoMultiRows.filter(r=>r.key!==key);
  renderPhotoMultiRows();
}
// 슬롯당 사진 1장(교체 방식) — 카드 전체를 채우는 큰 미리보기와 짝을 이루는 단순한 모델로
// 변경(2026-08-10, 안전관리 앱과 동일). 새 파일을 고르면 기존 사진을 그대로 대체한다.
function uploadPhotoMultiFile(input, key){
  const file=(input.files||[])[0];
  if(!file) return;
  if(!isAuthed()){ toast('로그인이 필요합니다.'); return; }
  const row=_photoMultiRows.find(r=>r.key===key);
  if(!row) return;
  compressImageToLimit(file, UPLOAD_MAX_BYTES).then(outFile=>{
    if(outFile.size>UPLOAD_MAX_BYTES) throw new Error('파일 용량 초과 (최대 '+UPLOAD_MAX_LABEL+')');
    const formData=new FormData();
    formData.append('file', outFile);
    formData.append('app', 'monthly-inspection-team');
    return fetch(CFG.workerUrl+'/upload', { method:'POST', body:formData })
      .then(r=>{ if(!r.ok) return r.text().then(t=>{ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); })
      .then(data=>{ row.files=[{ url:data.url, name:file.name }]; renderPhotoMultiRows(); });
  }).catch(e=>{ toast('사진 업로드 실패('+file.name+'): '+e.message); console.error(e); });
  input.value='';
}
function removePhotoMultiFile(key, fileIdx){
  const row=_photoMultiRows.find(r=>r.key===key);
  if(!row) return;
  row.files.splice(fileIdx,1);
  renderPhotoMultiRows();
}
// 터널명·일자·제목이 더 이상 공용 필드가 아니라 카드마다 개별 값이라(2026-08-10, 안전관리 앱과
// 동일 전환), 검증·중복레코드 매칭·제목 생성을 전부 행 단위로 한다. 제목은 사용자에게 입력받지
// 않고 해당 행의 일자로부터 자동 생성한다(titleWithMonth — 일자에서 연·월만 쓰므로 그대로 유지 가능).
async function submitPhotoMulti(){
  const tabDef=getTabDef('photo');
  if(!isAuthed()){ alert('로그인이 필요합니다.'); closeAddModal(); openCfgModal(); return; }

  // 등록 대상 판정은 사진설명·사진 여부만 본다(안전관리 앱과 동일 기준, 2026-08-03 버그 수정) —
  // 기본으로 채워지는 번호(placeholder)만으로 "작성됨"으로 잘못 인식하면, 날짜별로 나눠 며칠에
  // 걸쳐 일부 카드만 등록하는 실사용 흐름에서 아직 안 건드린 카드까지 필수값 누락으로 막혀버린다.
  const usedRows=_photoMultiRows.filter(row=>row.desc.trim() || row.files.length);
  if(!usedRows.length){ alert('사진설명·사진을 하나 이상 입력해주세요.'); return; }
  const missingRow=usedRows.find(row=>!row.tunnel || !row.date || !String(row.num||'').trim());
  if(missingRow){ alert('#'+(missingRow.num||'-')+' 카드의 터널명·일자·번호를 입력해주세요.'); return; }

  const btn=document.getElementById('addSubmitBtn');
  const lbl=document.getElementById('addSubmitLabel');
  btn.disabled=true;
  showAddModalProgress();
  const total=usedRows.length;
  let done=0;
  const progress=()=>{ lbl.textContent='등록 중... ('+(++done)+'/'+total+')'; updateAddModalProgress(done,total); };

  // 같은 터널·월·번호(슬롯)에 이미 저장된 레코드가 있으면 새로 만들지 않고 그 레코드를 수정한다

  try{

    results.forEach(({page,existingId})=>{
      const parsed=parseRecord(tabDef, page);
      const idx=existingId ? arr.findIndex(r=>r.id===existingId) : -1;

function submitAddForm(){

  const values={};

  tabDef.fields.forEach((f,idx)=>{
    if(f.header) return;
    if(f.key==='제목'){
      const dep={}; (f.dependsOn||[]).forEach(k=>{ dep[k]=values[k]; });
      values[f.key]=(f.optionsFn(dep)||[])[0]||null;
      return;
    }
    const v=getFieldValue(f, idx);
    values[f.key]=v;
    const isEmpty=Array.isArray(v) ? v.length===0 : !v;
    if(f.required && isEmpty && !missing) missing=f.label||f.key;
  });
  if(missing){ alert(missing+'을(를) 입력해주세요.'); return; }

  const properties={};

  const reqBody=isEdit ? JSON.stringify({properties}) : JSON.stringify({parent:{database_id:tabDef.dbId},properties});

    .then(page=>{
      btn.disabled=false; lbl.textContent=isEdit?'수정':'등록';

      // 불러오면 수십 초가 걸린다(2026-07-24 확인) — 응답으로 받은 레코드 하나만 로컬 상태에
      // 반영해 재렌더링하고, 전체 재동기화는 새로고침 버튼에 맡긴다.
      const targetTab=EDIT_TAB||tabDef.id;
      const targetTabDef=getTabDef(targetTab);
      const rec=parseRecord(targetTabDef, page);
      const arr=TAB_STATE[targetTab].records;
      const idx=arr.findIndex(r=>r.id===rec.id);
      if(idx>=0) arr[idx]=rec;
      else{
        const dateKey=targetTabDef.dateKey;
        const val=dateKey?(rec[dateKey]||''):'';
        const pos=dateKey ? arr.findIndex(r=>(r[dateKey]||'')<val) : -1;

async function submitElecinspChecklist(){

  const shared={};
  let missing=null;

    if(f.key==='제목'){
      const dep={}; (f.dependsOn||[]).forEach(k=>{ dep[k]=shared[k]; });
      shared[f.key]=(f.optionsFn(dep)||[])[0]||null;
      return;
    }
    const v=getFieldValue(f, idx);
    shared[f.key]=v;
    if(f.required && !v && !missing) missing=f.label||f.key;
  });
  if(missing){ alert(missing+'을(를) 입력해주세요.'); return; }

  const checkedGubuns=elecinspCheckedGubuns();

      if(chk && chk.checked){
        selected.push({ gubun, item, method:teamMethodFor(gubun,item), result:document.getElementById('eic_result_'+gi+'_'+i)?.value||'양호' });
      }
    });
  });
  if(!selected.length){ alert('점검내용을 하나 이상 선택해주세요.'); return; }

  const btn=document.getElementById('addSubmitBtn');
  const lbl=document.getElementById('addSubmitLabel');
  btn.disabled=true;

  const total=selected.length;
  let done=0;
  const progress=()=>{ lbl.textContent='등록 중... ('+(++done)+'/'+total+')'; updateAddModalProgress(done,total); };

  const tasks=selected.map(sel=>()=>{
    const properties={
      '터널명':buildPropValue('select', shared['터널명']),

      '점검방법':buildPropValue('select', sel.method),

    if(shared['특이사항']) properties['특이사항']=buildPropValue('text', shared['특이사항']);
    return notionFetch('/v1/pages','POST',{parent:{database_id:tabDef.dbId}, properties}).then(page=>{ progress(); return page; });
  });

  try{
    const pages=await runWithConcurrency(tasks, 6);
    const arr=TAB_STATE['elecinsp'].records;
    pages.forEach(page=>{ arr.push(parseRecord(tabDef, page)); });
    applyLatestFilterDefault('elecinsp');
    renderTabTable('elecinsp');
    updateLastUpdate();
    btn.disabled=false; lbl.textContent='등록';
    closeAddModal();
    toast(selected.length+'건 등록되었습니다.');

    alert('등록 실패: '+e.message+' — 일부 항목은 이미 저장되었을 수 있어 새로고침 후 확인해주세요.');
    console.error(e);

function deleteRecord(tabId, pageId){
  if(!isAuthed()){ alert('로그인 후 사용 가능합니다.\n설정 버튼에서 로그인해주세요.'); return; }
  if(!confirm('이 기록을 삭제(휴지통 이동)할까요?')) return;
  fetch(CFG.workerUrl+'/v1/pages/'+pageId,{
    method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({in_trash:true})
  }).then(r=>{ if(!r.ok) return r.text().then(t=>{ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); })
    .then(()=>{
      // 전체 재조회 대신 삭제된 레코드만 로컬 상태에서 제거(등록/수정과 동일한 이유 —
      // 전기시설점검DB처럼 레코드가 많은 탭에서 매번 전체 재조회하면 느리다)
      closeDetailModal();
      const arr=TAB_STATE[tabId].records;
      const idx=arr.findIndex(r=>r.id===pageId);
      if(idx>=0) arr.splice(idx,1);
      renderTabTable(tabId);
      toast('삭제되었습니다.');
    })
    .catch(e=>{
      if((e.message||'').indexOf('archived')>-1){
        closeDetailModal();
        const arr=TAB_STATE[tabId].records;
        const idx=arr.findIndex(r=>r.id===pageId);
        if(idx>=0) arr.splice(idx,1);
        renderTabTable(tabId);
        toast('이미 삭제된 기록입니다.');
        return;
      }
      alert('삭제 실패: '+e.message); console.error(e);
    });
}

var EXCEL_LIB_LOADING=null; // ExcelJS 로딩 프로미스(zip 필요 여부와 무관하게 1회만)
var JSZIP_LIB_LOADING=null; // JSZip 로딩 프로미스 — ExcelJS와 별도 캐시 필수
// 이전엔 needsZip 값과 무관하게 EXCEL_LIB_LOADING 하나로 캐시해서, needsZip:false로 먼저 호출된
// 뒤(예: 발전기점검 보고서) needsZip:true로 호출하면(예: 점검사진 보고서) 캐시된 프로미스를 그대로
// 반환해버려 JSZip을 영영 안 불러오는 버그가 있었다("JSZip is not defined", 2026-07-22 실사용
// 중 발견). ExcelJS/JSZip을 각자 독립 캐시로 분리해 needsZip 조합이 달라져도 항상 필요한 만큼만
// 로드되게 고쳤다.
function loadExcelLib(needsZip){
  function loadScript(src, integrity){
    return new Promise((resolve, reject)=>{
      const s=document.createElement('script');
      s.src=src; s.integrity=integrity; s.crossOrigin='anonymous';
      s.onload=()=>resolve();
      s.onerror=()=>{ s.remove(); reject(new Error('라이브러리 로드 실패: '+src)); };
      document.head.appendChild(s);
    });
  }
  if(!window.ExcelJS && !EXCEL_LIB_LOADING){
    EXCEL_LIB_LOADING=loadScript(
      'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
      'sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz'
    ).catch(e=>{ EXCEL_LIB_LOADING=null; throw e; });
  }
  if(needsZip && !window.JSZip && !JSZIP_LIB_LOADING){
    JSZIP_LIB_LOADING=loadScript(
      'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
      'sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG'
    ).catch(e=>{ JSZIP_LIB_LOADING=null; throw e; });
  }
  return Promise.all([
    window.ExcelJS ? Promise.resolve() : EXCEL_LIB_LOADING,
    (needsZip && !window.JSZip) ? JSZIP_LIB_LOADING : Promise.resolve()
  ]);
}

};
function excelCharWeight(ch){
  const code=ch.codePointAt(0);
  const cjk=(code>=0xac00&&code<=0xd7a3)||(code>=0x1100&&code<=0x11ff)||(code>=0x3130&&code<=0x318f)||(code>=0x4e00&&code<=0x9fff)||(code>=0xff00&&code<=0xffef);
  return cjk?2:1;
}
function excelStrWidth(s){ let w=0; Array.from(String(s||'')).forEach(ch=>{ w+=excelCharWeight(ch); }); return w; }
function excelAutoWidth(strings, min, max, padding){
  min=min||8; max=max||40; padding=padding||5;
  let w=min;
  strings.forEach(s=>{ w=Math.max(w, excelStrWidth(s)+padding); });
  return Math.min(w, max);
}
// wrapText 컬럼의 실제 줄바꿈 줄 수를 열너비 기준으로 근사 추정(exceljs는 렌더링을
// 하지 않아 정확한 줄 수를 알 수 없음 — 자동열폭 계산과 같은 근본적 한계, 보수적으로 추정)
function excelEstimateWrappedLines(text, colWidthChars){
  const w=excelStrWidth(text);
  if(w===0) return 1;
  return Math.max(1, Math.ceil(w/Math.max(1, colWidthChars-2)));
}
function excelWrapAwareRowHeight(row, columns, colWidths, fontSize, baseHeight){
  let maxLines=1;
  columns.forEach((col,i)=>{
    if(!col.wrap) return;
    const lines=excelEstimateWrappedLines(row[col.key], colWidths[i]);
    if(lines>maxLines) maxLines=lines;
  });
  const lineHeightPt=fontSize*1.4;
  const neededHeight=maxLines*lineHeightPt+16; // 상하 여백(2026-07-24 확대 — 기존 +6은 좁아 보인다는 피드백)
  return Math.max(baseHeight, neededHeight);
}
function excelParseDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));
  if(!m) return null;
  return new Date(Date.UTC(Number(m[1]), Number(m[2])-1, Number(m[3])));
}
// 인쇄 방향 자동 판정 — 열 너비(excelAutoWidth로 이미 계산된 문자 단위) 합으로 판단한다.
// fitToPage:1(가로 1페이지에 맞춤)이 항상 걸려 있어 어느 쪽이든 인쇄는 되지만, 열이 많고 넓을수록
// 세로(A4 가용폭 약 19cm)보다 가로(약 26.7cm, 세로 대비 약 1.4배)가 축소율이 적어 더 읽기 좋다.
// opts.orientation을 명시하면 이 자동판정을 덮어쓴다(강제 지정이 필요한 특수 케이스용).
function excelAutoOrientation(colWidths){
  const total=colWidths.reduce((s,w)=>s+w,0);
  return total>100 ? 'landscape' : 'portrait';
}
// ── 엑셀 사진 임베드 (하자보수현황 앱 buildExcelReport()와 동일 로직 이식, 2026-07-21) ──
const EXCEL_PHOTO_INSET_EMU=19050;
function excelFetchImage(url){
  if(!url || !/^https?:\/\//i.test(url)) return Promise.resolve(null);
  // cache:'no-store' — 다른 origin에서 캐시된 CORS 헤더 없는 응답이 재사용돼 fetch가 실패하는
  // 사례가 있어 항상 네트워크에서 새로 받는다(xlsx-report-export 스킬 참고).
  return fetch(url, {cache:'no-store'}).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    const contentType=r.headers.get('content-type');
    return r.arrayBuffer().then(buf=>{
      const ext=/png/i.test(contentType||url)?'png':/gif/i.test(contentType||url)?'gif':(/jpe?g/i.test(contentType||url)?'jpeg':null);
      if(!ext){ console.warn('지원하지 않는 이미지 형식:', url, contentType); return null; }
      return {buffer:buf, extension:ext};
    });
  }).catch(e=>{ console.warn('사진 로드 실패:', url, e.message); return null; });
}
// 사진 셀 앵커 — 열/행 폭을 직접 계산하지 않고 "다음 열/행의 시작점에서 인셋만큼 음수 오프셋으로
// 당겨" 지정한다(EMU/폰트 근사식 의존 버그를 피하는 방식, scripts/lib/xlsx_report_lib.mjs와 동일).
function excelPhotoAnchor(col, rn0){
  return {
    tl:{nativeCol:col, nativeColOff:EXCEL_PHOTO_INSET_EMU, nativeRow:rn0, nativeRowOff:EXCEL_PHOTO_INSET_EMU},
    br:{nativeCol:col+1, nativeColOff:-EXCEL_PHOTO_INSET_EMU, nativeRow:rn0+1, nativeRowOff:-EXCEL_PHOTO_INSET_EMU},
    editAs:'twoCell'
  };
}
// 여러 칸에 걸친 병합 범위(예: 참고사진 박스) 전체를 채우는 앵커 — excelPhotoAnchor(1칸 전용)의
// 일반화 버전, col0/row0(0-based, 병합 시작칸)~col1/row1(0-based, 병합 끝칸) 그대로 받는다.
function excelPhotoAnchorBlock(col0, row0, col1, row1){
  return {
    tl:{nativeCol:col0, nativeColOff:EXCEL_PHOTO_INSET_EMU, nativeRow:row0, nativeRowOff:EXCEL_PHOTO_INSET_EMU},
    br:{nativeCol:col1+1, nativeColOff:-EXCEL_PHOTO_INSET_EMU, nativeRow:row1+1, nativeRowOff:-EXCEL_PHOTO_INSET_EMU},

  };
}
// exceljs는 삽입 이미지의 "가로 세로 비율 고정"을 항상 1로 하드코딩해서 옵션이 없음 —
// 저장된 xlsx의 drawing XML을 직접 열어 0으로 바꿔준다.
function excelUnlockAspectRatio(buffer){
  return JSZip.loadAsync(buffer).then(zip=>{
    const files=Object.keys(zip.files).filter(f=>/^xl\/drawings\/drawing\d+\.xml$/.test(f));
    return Promise.all(files.map(f=>
      zip.file(f).async('string').then(xml=>{ zip.file(f, xml.replace(/noChangeAspect="1"/g,'noChangeAspect="0"')); })
    )).then(()=>zip.generateAsync({type:'blob'}));
  });
}
// 동시 fetch 과다로 인한 지연/차단을 막기 위해 N개씩 배치 처리
function excelBatchPromises(items, worker, batchSize){
  batchSize=batchSize||6;
  let idx=0;
  function next(){
    if(idx>=items.length) return Promise.resolve();
    const batch=items.slice(idx, idx+batchSize);
    idx+=batchSize;
    return Promise.all(batch.map(worker)).then(next);
  }
  return next();
}
// 다운로드 파일명 규칙(2026-07-23 사용자 요청, "엑셀 생성"·"보고서 생성"(개별/통합) 전부 통일):
// "{연}년 {월}월 {탭 보고서명}[보고서]_{터널명}". 탭별 보고서명은 이미 각 buildOneXReport()가
// 쓰던 이름을 그대로 재사용 — 엑셀생성은 그 이름 그대로, 보고서생성은 "보고서"만 뒤에 붙인다
// (예: 전기설비기록표 → 엑셀생성 "...전기설비기록표_...", 보고서생성 "...전기설비기록표보고서_...").
// 파일명 접두사에 이미 연/월 날짜가 들어있어 생성시각 접미사는 넣지 않는다(2026-07-23 후속 요청 —
// 처음엔 버전 구분용으로 yyyyMMddHHmm을 붙였었지만 날짜가 이미 있는데 또 붙이면 중복이라 삭제).
const TAB_REPORT_BASENAME={
  elecinsp:'전기시설점검표', repair:'고장수리실적', photo:'점검사진대지'
};
// 다운로드 파일명 전용 터널명 축약(2026-07-23 사용자 요청, 파일명이 길다는 피드백) — 시트/보고서
// 내부 표시 텍스트("□ 청하터널(주)" 등)는 그대로 두고 파일명에서만 "터널" 글자를 뺀다.
// 청하터널(주)→청하(주), 청하터널(부)→청하(부), 흥해터널→흥해, 남정5터널→남정5.
function tunnelFnameAbbr(tunnel){
  return (tunnel||'').replace('터널','');
}
// "엑셀 생성"은 보고서 생성과 달리 연/월을 직접 고르지 않으므로, 현재 연/월 필터가 특정 값으로
// 좁혀져 있으면 그 값을, "전체"면 로드된 데이터 중 가장 최근 날짜를 파일명용 연/월로 쓴다
// (각 exportXInspectionReport()가 보고서 생성에 쓰는 것과 동일한 결정 규칙, 파일명 계산 전용으로
// 별도 헬퍼화 — 데이터가 아예 없으면 null을 돌려줘 호출부가 연/월 없이 파일명을 만들게 한다).
function resolveTabYearMonth(tabId, dateKey){
  const f=_tabFilters[tabId]||{};
  if(f.year && f.year!=='ALL' && f.month && f.month!=='ALL'){
    return {year:parseInt(f.year,10), month:parseInt(f.month,10)};
  }
  const dates=(TAB_STATE[tabId].records||[]).map(r=>r[dateKey]).filter(Boolean).sort();
  if(!dates.length) return null;
  const latest=dates[dates.length-1];
  return {year:parseInt(latest.slice(0,4),10), month:parseInt(latest.slice(5,7),10)};
}
function buildExcelReport(opts){
  const btn=document.getElementById(opts.btnId);
  const lbl=document.getElementById(opts.lblId);
  const sheets = opts.sheets || [{sheetName:opts.sheetName, title:opts.title, columns:opts.columns, rows:opts.rows, orientation:opts.orientation}];
  if(!sheets.some(s=>(s.rows||[]).length)){ alert('내보낼 데이터가 없습니다.'); return; }
  const anyPhoto = sheets.some(s=>(s.columns||[]).some(c=>c.photo));
  let failedPhotoCount=0;
  btn.disabled=true; lbl.textContent='준비 중...';
  loadExcelLib(anyPhoto).then(()=>{
    const wb=new ExcelJS.Workbook();
    const photoTasks=[];
    sheets.forEach(sheetOpts=>{
      const rows=sheetOpts.rows||[];
      const columns=sheetOpts.columns;
      const colWidths=columns.map(col=>col.width || excelAutoWidth(col.photo?[col.header]:[col.header].concat(rows.map(r=>r[col.key]))));
      const orientation=sheetOpts.orientation || excelAutoOrientation(colWidths);
      const ws=wb.addWorksheet(sheetOpts.sheetName,{
        views:[{state:'frozen',ySplit:2,showGridLines:false,zoomScale:90}],
        pageSetup:{paperSize:9,orientation,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,verticalCentered:false,margins:EXCEL_PAGE_PRESETS[orientation],printTitlesRow:'2:2'},
        headerFooter:{oddHeader:'&C&"맑은 고딕"&9&P / &N'+'&R&"맑은 고딕,Regular"&11'+EXCEL_COMPANY_NAME+'  출력일: &D &T',oddFooter:''}
      });
      ws.columns=colWidths.map(w=>({width:w}));
      const titleRow=ws.getRow(1);
      titleRow.height=EXCEL_ROW_HEIGHTS.title;
      const titleCell=titleRow.getCell(1);
      titleCell.value=sheetOpts.title; titleCell.font=EXCEL_TITLE_FONT; titleCell.alignment={vertical:'middle'};
      const headerRow=ws.getRow(2);
      headerRow.height=EXCEL_ROW_HEIGHTS.header;
      columns.forEach((col,i)=>{
        const cell=headerRow.getCell(i+1);
        cell.value=col.header; cell.font=EXCEL_BODY_FONT;
        cell.alignment={vertical:'middle',horizontal:'center'};
        cell.border=excelGridBorder(true, false, i, i===columns.length-1); cell.fill=EXCEL_HEADER_FILL;
      });
      // 사진 컬럼이 스키마에 하나라도 있으면 전체 데이터행을 큰 높이로 통일(인쇄 줄맞춤용,
      // 하자보수현황 앱과 동일 원칙 — 행마다 실제 사진 유무로 들쭉날쭉하게 하지 않는다)
      const photoColumns=[];
      columns.forEach((c,i)=>{ if(c.photo) photoColumns.push({col:c, i:i}); });
      const rowHeightForData = photoColumns.length ? EXCEL_ROW_HEIGHTS.dataWithPhoto : EXCEL_ROW_HEIGHTS.data;
      rows.forEach((r,i)=>{
        const rn=3+i;
        const row=ws.getRow(rn);
        row.height = photoColumns.length ? rowHeightForData : excelWrapAwareRowHeight(r, columns, colWidths, EXCEL_BODY_FONT.size, rowHeightForData);
        columns.forEach((col,ci)=>{
          const cell=row.getCell(ci+1);
          cell.font=EXCEL_BODY_FONT; cell.border=excelGridBorder(false, i===rows.length-1, ci, ci===columns.length-1);
          cell.alignment={vertical:'middle',horizontal:col.align==='left'?'left':'center',wrapText:!!col.wrap};
          if(col.photo) return;
          if(col.dateCol && r[col.key]){
            const d=excelParseDate(r[col.key]);
            if(d){ cell.value=d; cell.numFmt='yyyy-mm-dd'; } else { cell.value=r[col.key]; }
          } else {
            cell.value=r[col.key];
            if(col.numFmt && typeof cell.value==='number') cell.numFmt = Number.isInteger(cell.value) ? col.numFmt.replace(/\.#+/,'') : col.numFmt;
          }
        });
        row.commit();
      });
      rows.forEach((r,i)=>{
        const rn0=2+i;
        photoColumns.forEach(pc=>{
          const url=r[pc.col.key+'_URL'];
          if(url) photoTasks.push({url, colIdx:pc.i, rn0, ws});
        });
      });
    });
    if(photoTasks.length) lbl.textContent='사진 불러오는 중...';
    return excelBatchPromises(photoTasks, task=>{
      return excelFetchImage(task.url).then(img=>{
        if(!img){ failedPhotoCount++; return; }
        const imgId=wb.addImage(img);
        task.ws.addImage(imgId, excelPhotoAnchor(task.colIdx, task.rn0));
      });
    }).then(()=>{
      lbl.textContent='파일 저장 중...';
      return wb.xlsx.writeBuffer();
    }).then(buf=>{
      return anyPhoto
        ? excelUnlockAspectRatio(buf)
        : new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    });
  }).then(blob=>{
    const url=URL.createObjectURL(blob);
    const fname=opts.fnamePrefix+'.xlsx';
    const a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    lbl.textContent = failedPhotoCount>0 ? ('완료(사진 '+failedPhotoCount+'건 누락)') : '완료!';
    setTimeout(()=>{ lbl.textContent=opts.lblDefault; }, failedPhotoCount>0 ? 3000 : 1500);
  }).catch(e=>{
    alert('엑셀 생성 실패: '+e.message);
    console.error(e);
    lbl.textContent=opts.lblDefault;
  }).finally(()=>{ btn.disabled=false; });
}
function exportTabExcel(tabId){
  const tabDef=getTabDef(tabId);
  if(!tabDef || !tabDef.fields){ toast('아직 준비 중인 탭입니다.'); return; }
  const fields=dataFields(tabDef).filter(f=>f.type!=='title');
  const tunnel=_tabFilters[tabId].tunnel;
  const rows=getVisibleRecords(tabId).map(r=>{
    const row={};
    fields.forEach(f=>{
      if(f.type==='number') row[f.key]=Number(r[f.key])||0;
      else if(f.type==='file') row[f.key+'_URL']=(r[f.key]||[])[0]?.url||'';
      else row[f.key]=r[f.key]||'';
    });
    return row;
  });
  const columns=fields.map(f=>({
    key:f.key, header:f.key,
    numFmt: f.type==='number'?'#,##0.##':undefined,
    photo: f.type==='file'||undefined,
    wrap: f.type==='text'||undefined,
    align: f.type==='text'?'left':undefined,
    width: f.type==='file'?18:undefined
  }));
  const ym=resolveTabYearMonth(tabId, tabDef.dateKey);
  const ymPrefix=ym ? `${ym.year}년 ${String(ym.month).padStart(2,'0')}월 ` : '';
  buildExcelReport({
    btnId:'excelBtn_'+tabId, lblId:'excelLbl_'+tabId, lblDefault:'엑셀 생성',
    sheetName:tabDef.label, title:'월간점검결과 - '+tabDef.label,
    fnamePrefix:ymPrefix+(TAB_REPORT_BASENAME[tabId]||tabDef.label)+'_점검팀'+(tunnel?'_'+tunnelFnameAbbr(tunnel):''),
    columns, rows
  });
}

// 게 불편하다는 피드백에 따라 실제 버튼의 disabled/문구 변화를 MutationObserver로 상단 버튼에 그대로
// 반영하는 방식으로 교체.
function clickAndMirror(id, topBtn){
  const el=document.getElementById(id);
  if(!el) return;
  if(topBtn){
    const lbl=document.getElementById(id+'Label');
    const sync=()=>{ topBtn.disabled=el.disabled; topBtn.textContent=lbl?lbl.textContent:el.textContent; };
    sync();
    const mo=new MutationObserver(sync);
    mo.observe(el,{attributes:true,attributeFilter:['disabled']});
    mo.observe(lbl||el,{childList:true,characterData:true,subtree:true});
    const stop=setInterval(()=>{ if(!el.disabled){ clearInterval(stop); setTimeout(()=>mo.disconnect(),500); } },150);
  }
  el.click();
}

// 이번 달 이미 저장된 값(정확한 터널·구분·점검내용·연월 일치) — 같은 항목이 그 달에 여러 번(월 2회
// 등) 점검됐을 수 있어 배열로 반환하고, 날짜 오름차순으로 정렬해 항목당 여러 행에 순서대로 채운다.
function elecInspRowDatedRecords(tunnel, gubun, content, ym){
  return (TAB_STATE.elecinsp.records||[])
    .filter(r=>r['터널명']===tunnel && r['구분']===gubun && r['점검내용']===content && (r['날짜']||'').slice(0,7)===ym)
    .sort((a,b)=>(a['날짜']||'').localeCompare(b['날짜']||''));
}
// 이번 달 이력이 없을 때 "점검결과" 기본값으로 쓸 가장 최근 이력(안전관리 앱 monthlyLatestRecord와 동일 패턴)
function elecInspRowLatestRecord(tunnel, gubun, content){
  const recs=(TAB_STATE.elecinsp.records||[]).filter(r=>r['터널명']===tunnel && r['구분']===gubun && r['점검내용']===content && r['날짜']);
  if(!recs.length) return null;
  return recs.reduce((a,b)=>(a['날짜']>b['날짜']?a:b));
}
// 항목별 기본 표시 행 수 — "터널진입차단설비"는 월 2회 고정이라 기본 2행, 나머지 항목은 기본 1행
// (2026-08-12 사용자 요청). 이미 그 달에 저장된 레코드가 기본값보다 많으면(예외적으로 그 이상 점검)
// 그만큼 자동으로 늘어나고, 어떤 항목이든 "+" 버튼으로 행을 더 늘릴 수 있다.
function elecinspDefaultCount(gubun){ return gubun==='터널진입차단설비' ? 2 : 1; }
function elecinspItemKey(gi, ci){ return gi+'_'+ci; }
let _elecinspExtraCount={};
function elecinspRowCount(gi, ci, gubun, existingCount){
  return Math.max(elecinspDefaultCount(gubun), existingCount) + (_elecinspExtraCount[elecinspItemKey(gi,ci)]||0);
}
function elecinspAddRow(gi, ci){
  const key=elecinspItemKey(gi,ci);
  _elecinspExtraCount[key]=(_elecinspExtraCount[key]||0)+1;
  renderElecinspGrid();
}
function elecinspRemoveRow(gi, ci){
  const key=elecinspItemKey(gi,ci);
  if(_elecinspExtraCount[key]>0){ _elecinspExtraCount[key]--; renderElecinspGrid(); }
}
function renderElecinspGrid(){
  const wrap=document.getElementById('rpElecinspBody'); if(!wrap) return;
  const tunnel=_teamElecTunnel;
  const ym=REPORT_SEL.year+'-'+REPORT_SEL.month;
  let html=`<div class="tbl-wrap"><table class="rc-monthly-table"><thead><tr><th style="width:100px">구분</th><th>점검내용</th><th style="width:90px">점검방법</th><th style="width:120px">점검결과</th><th style="width:150px">점검일자</th><th style="width:140px">비&nbsp;&nbsp;고</th><th style="width:70px">행추가</th></tr></thead><tbody>`;
  // 구분(gubun) rowspan은 그 구분에 속한 모든 항목의 총 행수(항목당 다중 행 포함) 합계.
  const gubunTotalRows={};
  ELECINSP_GUBUN_ORDER.forEach((gubun, gi)=>{
    gubunTotalRows[gubun]=teamChecklistOptionsForTunnel(tunnel, gubun).reduce((sum,content,ci)=>{
      const existingCount=elecInspRowDatedRecords(tunnel, gubun, content, ym).length;
      return sum + elecinspRowCount(gi, ci, gubun, existingCount);
    }, 0);
  });
  ELECINSP_GUBUN_ORDER.forEach((gubun, gi)=>{
    const contents=teamChecklistOptionsForTunnel(tunnel, gubun);
    let gubunPrinted=false;
    contents.forEach((content, ci)=>{
      const method=teamMethodFor(gubun, content);
      const dateds=elecInspRowDatedRecords(tunnel, gubun, content, ym);
      const rowCount=elecinspRowCount(gi, ci, gubun, dateds.length);
      const baseCount=Math.max(elecinspDefaultCount(gubun), dateds.length);
      for(let ri=0; ri<rowCount; ri++){
        const dated=dateds[ri] || null;
        const latest=dated || elecInspRowLatestRecord(tunnel, gubun, content);
        const curVal=latest ? latest['점검결과'] : '양호';
        const opts=['양호','불량','점검요','-'].map(v=>`<option value="${esc(v)}"${curVal===v?' selected':''}>${esc(v)}</option>`).join('');
        const rid='eig_'+gi+'_'+ci+'_'+ri, did='eigd_'+gi+'_'+ci+'_'+ri, bid='eigb_'+gi+'_'+ci+'_'+ri;
        html+='<tr>';
        if(!gubunPrinted){ html+=`<td rowspan="${gubunTotalRows[gubun]}" class="rc-monthly-gubun">${esc(gubun)}</td>`; gubunPrinted=true; }
        if(ri===0) html+=`<td rowspan="${rowCount}" class="rc-monthly-content">${esc(content)}</td>`;
        if(ri===0) html+=`<td rowspan="${rowCount}" class="rc-monthly-method">${esc(method)}</td>`;
        html+=`<td><select id="${rid}" class="modal-select elec-grid-select" style="width:100%" data-gubun="${esc(gubun)}" data-content="${esc(content)}">${opts}</select></td>`;
        html+=`<td><input type="date" id="${did}" class="modal-input" style="width:100%" value="${esc(dated?dated['날짜']:'')}" data-existing-id="${dated?esc(dated.id):''}"></td>`;
        html+=`<td><input type="text" id="${bid}" class="modal-input" style="width:100%" value="${esc(dated?dated['비고']:'')}"></td>`;
        const isLast=ri===rowCount-1, isExtra=ri>=baseCount;
        html+=`<td style="text-align:center;white-space:nowrap"><div style="display:flex;gap:4px;justify-content:center">`;
        if(isLast) html+=`<button type="button" class="elec-row-btn" onclick="elecinspAddRow(${gi},${ci})" title="행 추가">+</button>`;
        if(isExtra) html+=`<button type="button" class="elec-row-btn elec-row-del" onclick="elecinspRemoveRow(${gi},${ci})" title="행 삭제">×</button>`;
        html+=`</div></td>`;
        html+='</tr>';
      }
    });
  });
  html+=`</tbody></table></div>
    <div class="modal-btns" style="margin-top:18px"><button class="add-submit-btn" id="rpElecinspSubmitBtn" onclick="submitElecinspGridForm()">등록</button></div>
    <div class="modal-progress-wrap" id="rpElecinspProgressWrap" style="display:none;margin-top:10px"><div class="modal-progress-bar" id="rpElecinspProgressBar"></div></div>`;
  wrap.innerHTML=html;
}
async function submitElecinspGridForm(){
  if(!isAuthed()){ alert('로그인이 필요합니다.'); openCfgModal(); return; }
  const tunnel=_teamElecTunnel;
  // 월간점검 페이지와 동일 기준 — 점검일자를 실제로 입력한 행만 저장 대상(결과는 항상 기본값이
  // 채워져 있어 "선택됨" 여부로는 저장 대상을 구분할 수 없음).
  const dateInputs=[...document.querySelectorAll('#rpElecinspBody input[id^="eigd_"]')].filter(inp=>inp.value);
  if(!dateInputs.length){ alert('등록할 항목의 점검일자를 하나 이상 입력해주세요.'); return; }
  const ym=REPORT_SEL.year+'-'+REPORT_SEL.month;
  if(!confirmDateOutOfMonth(dateInputs.map(inp=>inp.value), ym)) return;
  const dbId=getTabDef('elecinsp').dbId;
  const btn=document.getElementById('rpElecinspSubmitBtn');
  btn.disabled=true; btn.textContent='등록 중...';
  const wrap=document.getElementById('rpElecinspProgressWrap'), bar=document.getElementById('rpElecinspProgressBar');
  wrap.style.display=''; bar.style.width='0%';
  let done=0, failed=0;
  const tasks=dateInputs.map(inp=>async ()=>{
    const suffix=inp.id.slice(5); // 'eigd_'.length===5
    const sel=document.getElementById('eig_'+suffix);
    const bEl=document.getElementById('eigb_'+suffix);
    const gubun=sel.dataset.gubun, content=sel.dataset.content;
    const dateVal=inp.value;
    // 항목당 여러 행이 있을 수 있어 (터널·구분·점검내용·연월)만으로는 레코드를 특정할 수 없다 —
    // 렌더 시점에 행별로 매겨둔 기존 레코드 id(data-existing-id)로 PATCH/POST를 구분한다.
    const existingId=inp.dataset.existingId || '';
    const props={
      '터널명':buildPropValue('select', tunnel),
      '날짜':buildPropValue('date', dateVal),
      '제목':buildPropValue('title', titleWithMonth(dateVal,'전기시설점검표')),
      '구분':buildPropValue('select', gubun),
      '점검내용':buildPropValue('text', content),
      '점검방법':buildPropValue('select', teamMethodFor(gubun, content)),
      '점검결과':buildPropValue('select', sel.value),
      '비고':buildPropValue('text', bEl.value)
    };
    try{
      const page=existingId
        ? await notionFetch('/v1/pages/'+existingId, 'PATCH', {properties:props})
        : await notionFetch('/v1/pages', 'POST', {parent:{database_id:dbId}, properties:props});
      done++; bar.style.width=Math.round(done/dateInputs.length*100)+'%';
      return page;
    }catch(e){ failed++; throw e; }
  });
  try{
    await runWithConcurrency(tasks, 6);
    await loadTabData('elecinsp');
    btn.disabled=false; btn.textContent='등록';
    toast(dateInputs.length+'건 등록되었습니다.');
    if(_reportCurPage==='elecinsp') renderElecinspGrid();
  }catch(e){
    btn.disabled=false; btn.textContent='등록';
    alert('등록 실패: '+e.message+(failed?' — 일부 항목은 이미 저장되었을 수 있어 새로고침 후 확인해주세요.':''));
    console.error(e);
  }
}
