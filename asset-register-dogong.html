<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>비품대장-도공</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0.3' y2='1'%3E%3Cstop offset='0' stop-color='%234A9BE8'/%3E%3Cstop offset='1' stop-color='%230C447C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='5.3' fill='url(%23g)'/%3E%3Cpath d='M7.1 18.5V12.9C7.1 9 9.6 6.6 12 6.6C14.4 6.6 16.9 9 16.9 12.9V18.5Z' fill='%23fff'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  /* work-portal 공통 색상 팔레트 기준(비품대장-수자원 앱과 수치 동일) */
  --sky:#0366D6;--sky50:#E9F1FE;--sky100:#C7DCF6;--sky600:#005CC5;--sky800:#032F62;
  --teal50:#E1F5EE;--teal100:#9FE1CB;--teal600:#0F6E56;
  --coral:#D85A30;--coral50:#FAECE7;--coral100:#F5C4B3;--coral800:#712B13;
  --gray50:#F1EFE8;--gray100:#D3D1C7;--gray600:#5F5E5A;
  --bg:#FFFFFF;--card:#FFFFFF;--border:#E1E4E8;--border2:#F6F8FA;
  --txt:#24292E;--txt2:#3A4453;--txt3:#6A737D;
  --r6:6px;--r8:8px;--r10:10px;--r12:12px;--r16:16px;--r20:20px;
  --shadow:none;
  --hdr-bg:#0C447C;
  --hdr-text:#fff;
  --hdr-text-dim:rgba(255,255,255,.85);
  --hdr-btn-bg:rgba(255,255,255,.15);
  --hdr-btn-border:rgba(255,255,255,.35);
  --hdr-btn-hover-bg:rgba(255,255,255,.25);
  --hdr-btn-text:#fff;
  --hdr-shadow:0 2px 8px rgba(12,68,124,.3);
  --hdr-error-text:rgba(255,150,130,.9);
}
html[data-theme="light"]{
  --hdr-bg:#FFFFFF;
  --hdr-text:#032F62;
  --hdr-text-dim:#355E82;
  --hdr-btn-bg:#E6F1FB;
  --hdr-btn-border:#B7CEE8;
  --hdr-btn-hover-bg:#D3E7FA;
  --hdr-btn-text:#005CC5;
  --hdr-shadow:0 2px 8px rgba(12,68,124,.12);
  --hdr-error-text:#B3261E;
}
html[data-theme="dark"]{
  --bg:#24292E;--card:#1C2024;
  --border:rgba(255,255,255,.13);--border2:rgba(255,255,255,.09);
  --txt:rgba(255,255,255,.92);--txt2:rgba(255,255,255,.75);--txt3:rgba(255,255,255,.5);
  --shadow:none;
  --hdr-bg:#24292E;
  --hdr-shadow:0 2px 10px rgba(0,0,0,.4);
  --hdr-error-text:rgba(255,150,130,.9);
  --sky:#2E8FFF;
  --sky50:rgba(46,143,255,.16);--sky100:rgba(46,143,255,.32);
  --sky600:#79B8FF;--sky800:#C8E1FF;
  --teal50:rgba(29,158,117,.16);--teal100:rgba(29,158,117,.32);
  --teal600:#4FD8AC;
  --coral:#F2896A;--coral50:rgba(216,90,48,.16);--coral100:rgba(216,90,48,.32);--coral800:#F0916A;
}
html[data-theme="dark"] .pstat-other{background:rgba(255,255,255,.12);color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:14.5px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100dvh}

/* ── HEADER ── */
.header{background:var(--hdr-bg);height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--hdr-shadow);transition:background .18s ease}
.header-left{display:flex;align-items:center;gap:10px}
.logo-title{font-size:14.5px;font-weight:500;color:var(--hdr-text);letter-spacing:-.02em}
.header-right{display:flex;flex-direction:row;align-items:center;gap:10px}
.header-btns{display:flex;gap:6px}
.hdr-btn{background:var(--hdr-btn-bg);border:1px solid var(--hdr-btn-border);color:var(--hdr-btn-text);border-radius:16px;padding:4px 11px;font-size:12px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;min-height:27px;-webkit-tap-highlight-color:transparent}
.hdr-btn:hover{background:var(--hdr-btn-hover-bg)}
.hdr-btn:disabled{opacity:.4;cursor:not-allowed}
.last-update{font-size:11px;color:var(--hdr-text-dim);white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning{animation:spin .8s linear infinite;display:inline-block}

/* ── TOP TAB NAV ── */
.top-tabs{background:var(--card);border-bottom:1.5px solid var(--border);display:flex;padding:0 6px;box-shadow:0 2px 8px rgba(3,102,214,.07);overflow-x:auto;-webkit-overflow-scrolling:touch}
.top-tab{flex:0 0 auto;min-width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:transparent;color:var(--txt2);font-size:14px;font-weight:400;font-family:inherit;cursor:pointer;padding:8px 4px;-webkit-tap-highlight-color:transparent;transition:color .15s;position:relative;white-space:nowrap}
.top-tab.active{color:var(--sky600)}
html[data-theme="dark"] .top-tab.active{color:#fff}
.top-tab .tt-label{display:inline-block;padding:0 10px 6px;border-bottom:2.5px solid transparent;border-radius:2px 2px 0 0}
.top-tab.active .tt-label{border-bottom-color:var(--sky)}

/* ── MAIN ── */
.main{padding:10px 12px;max-width:1400px;margin:0 auto}

/* ── SECTION CARD ── */
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r16);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.detail-sc{background:transparent;border:none;box-shadow:none}
.detail-sc .tbl-wrap{background:var(--card);box-shadow:var(--shadow)}
.sc-hd{font-size:14px;font-weight:500;color:var(--txt);margin-bottom:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:500;background:var(--sky50);color:var(--sky600);border-radius:var(--r8);padding:3px 10px;border:1px solid var(--sky100)}
html[data-theme="dark"] .badge{color:#fff}

/* ── PANEL ── */
.panel{display:none}.panel.active{display:block}

/* ── DROPDOWN (목록방식) ── */
.dd-wrap{position:relative;display:inline-block}
.dd-btn{background:var(--sky50);border:1.5px solid var(--sky100);color:var(--sky800);border-radius:var(--r8);padding:5px 28px 5px 10px;font-size:13px;font-weight:400;font-family:inherit;cursor:pointer;min-height:30px;white-space:nowrap;display:flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent;user-select:none;position:relative;transition:border-color .15s}
.dd-btn::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--sky600)}
.dd-btn.active{background:#1565C0;color:#fff;border-color:#1565C0}
.dd-btn.active::after{color:#fff}
html[data-theme="dark"] .dd-btn{color:#fff}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r12);box-shadow:0 8px 24px rgba(3,102,214,.15);z-index:500;min-width:150px;display:none;overflow-y:auto;max-height:280px;scrollbar-width:none}
.dd-menu::-webkit-scrollbar{display:none}
.dd-menu.open{display:block}
.dd-opt{padding:9px 14px;font-size:13px;font-weight:500;color:var(--txt);white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;border-bottom:1px solid var(--border2)}
.dd-opt:hover{background:var(--sky50)}
.dd-opt.sel{background:#1565C0;color:#fff;font-weight:500}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r8);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:300px}
thead tr{background:var(--sky50)}
th{padding:7px 10px;text-align:left;font-size:13px;font-weight:400;color:var(--sky800);white-space:nowrap;border-bottom:1.5px solid var(--sky100)}
html[data-theme="dark"] th{color:#fff}
th.r,td.r{text-align:right}
td{padding:7px 10px;font-size:13px;color:var(--txt);border-bottom:1px solid var(--border2);vertical-align:middle;line-height:1.5}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--sky50)}

/* ── RANK ── */
.rank{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.r1{background:#FFD700;color:#6b4c00}.r2{background:#C0C0C0;color:#333}.r3{background:#CD7F32;color:#2b1400}.rn{background:var(--sky50);color:var(--sky800)}
html[data-theme="dark"] .rn{color:#fff}

/* ── FILTER ── */
.filter-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.detail-count-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:2px 0 8px}
.detail-count{font-size:12px;font-weight:500;background:var(--sky50);color:var(--sky600);border-radius:var(--r8);padding:3px 10px;border:1px solid var(--sky100)}
html[data-theme="dark"] .detail-count{color:#fff}
.count-actions{display:flex;gap:8px;flex-shrink:0}
.count-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.page-size-wrap .dd-btn{padding:5px 26px 5px 10px;font-size:12px;min-height:28px}

/* ── PAGINATION ── */
.pagination-row{display:flex;align-items:center;justify-content:center;gap:4px;padding:14px 0 2px;flex-wrap:wrap}
.page-btn{min-width:28px;height:28px;padding:0 6px;border-radius:var(--r8);border:1px solid var(--border);background:var(--card);color:var(--txt);font-size:12px;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s}
.page-btn:hover:not(:disabled){border-color:var(--sky)}
.page-btn:disabled{opacity:.4;cursor:default}
.page-btn.active{background:#1565C0;border-color:#1565C0;color:#fff;font-weight:500}
.page-btn.ellipsis{border:none;background:none;cursor:default;color:var(--sky600)}
.page-btn.ellipsis:hover{border:none}
.search-box{flex:1;min-width:160px;padding:0 12px;height:34px;border-radius:var(--r8);border:1px solid var(--border);font-size:13px;font-family:inherit;color:var(--txt);background:var(--card);outline:none}
.search-box:focus{border-color:var(--sky)}
.tb-action-btn{height:34px;padding:0 14px;border-radius:var(--r8);font-size:12px;font-weight:500;font-family:inherit;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.tb-action-btn.tb-add{background:#185FA5}
.tb-action-btn.tb-add:hover{background:#144d87}
.tb-action-btn.tb-excel{background:#0F6E56}
.tb-action-btn.tb-excel:hover{background:#0c5a46}
.tb-group-label{font-size:12px;font-weight:500;color:var(--txt);white-space:nowrap;flex-shrink:0;padding:0 1px;display:inline-flex;align-items:center;gap:8px}
.tb-group-label::before{content:'';display:inline-block;width:1px;height:16px;background:var(--txt);opacity:.6}
.tb-action-btn.tb-list{background:#5B4FBD}
.tb-action-btn.tb-list:hover{background:#4a3fa0}
.tb-action-btn.tb-delete{background:#495057}
.tb-action-btn.tb-delete:hover{background:#3a3f45}
.tb-action-btn.tb-delete.on{background:#B23A2E}
.tb-action-btn.tb-delete.on:hover{background:#962f25}
.tb-action-btn.tb-delete:disabled{opacity:.45;cursor:not-allowed}

/* ── 뱃지 ── */
.type-badge{display:inline-block;font-size:12px;font-weight:400;padding:3px 9px;border-radius:var(--r8);white-space:nowrap;margin:2px 0;color:#fff;border:1px solid rgba(0,0,0,.18)}
.badge-c0{background:#1565C0}
.badge-c1{background:#147A44}
.badge-c2{background:#B23A12}
.badge-c3{background:#A15C00}
.badge-c4{background:#5B4FBD}
.badge-c5{background:#0D6D63}

/* ── 사진 ── */
.col-photo{width:56px;min-width:52px;text-align:center}
.photo-upload-box{border:1.5px dashed var(--border);border-radius:var(--r8);padding:12px;background:var(--bg);transition:border-color .15s}
.photo-upload-box:hover{border-color:var(--sky100)}
.photo-upload-row{display:flex;align-items:center;gap:10px}
.photo-upload-file-btn{background:var(--sky50);border:1.5px solid var(--sky100);color:var(--sky800);border-radius:var(--r8);padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:background .12s}
.photo-upload-file-btn:hover{background:var(--sky100)}
html[data-theme="dark"] .photo-upload-file-btn{color:#fff}
.photo-upload-status{font-size:12px;color:var(--txt3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-upload-status.ok{color:var(--teal600);font-weight:500}
.photo-upload-status.err{color:var(--coral);font-weight:500}
.photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:var(--r6);border:1px solid var(--border);display:none;margin-top:10px;cursor:zoom-in}
.photo-thumb.show{display:block}
.photo-gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-gallery:empty{margin-top:0}
.pg-item{position:relative;width:64px;height:64px;flex-shrink:0}
.pg-item img{width:100%;height:100%;object-fit:cover;border-radius:var(--r6);border:1px solid var(--border);cursor:zoom-in}
.pg-item .pg-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--coral);color:#fff;border:1.5px solid var(--card);font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.photo-count-badge{font-size:10px;font-weight:600;color:var(--sky600);background:var(--sky50);border:1px solid var(--sky100);border-radius:8px;padding:1px 5px;line-height:1.4;white-space:nowrap}
html[data-theme="dark"] .photo-count-badge{color:#fff}
.photo-section{padding:10px 0;border-bottom:1px solid var(--border2)}
.photo-section:last-child{border-bottom:none}
.photo-label{font-size:12px;font-weight:500;color:var(--txt3);margin-bottom:6px}
.photo-wrap{position:relative;background:var(--bg);border-radius:var(--r8);overflow:hidden;border:1px solid var(--border)}
.photo-wrap a{display:block}
.photo-img{width:100%;max-height:280px;object-fit:contain;display:block;cursor:zoom-in;transition:opacity .25s}
.photo-img.loading{opacity:0}
.photo-img.loaded{opacity:1}
.photo-err{display:none;padding:20px;text-align:center;font-size:12px;color:var(--txt3);line-height:1.8}
.photo-err a{color:var(--sky600);font-weight:500;text-decoration:none}
.photo-spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.photo-spinner::after{content:'';width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--sky600);border-radius:50%;animation:spin .7s linear infinite}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 16px;color:var(--txt3)}
.empty-icon{font-size:34px;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:500;color:var(--txt2);margin-bottom:4px}
.empty-desc{font-size:13px}

/* ── MODAL ── */
#cfgModal{display:none}
#cfgModal.modal-open{display:block}
#addModal{display:none}
#addModal.modal-open{display:block}
#detailModal{display:none}
#detailModal.modal-open{display:block}
.detail-modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.detail-modal-hd h3{font-size:15px;font-weight:500;color:var(--txt)}
.detail-info-wrap{border:1.5px solid var(--border);border-radius:var(--r10);overflow:hidden;margin-bottom:14px}
.detail-info-row{display:flex;gap:0;border-bottom:1px solid var(--border2)}
.detail-info-row:last-child{border-bottom:none}
.detail-info-row:nth-child(odd){background:var(--card)}
.detail-info-row:nth-child(even){background:var(--sky50)}
.detail-info-key{font-size:12px;font-weight:400;color:var(--txt);min-width:88px;width:88px;flex-shrink:0;padding:10px 12px;background:rgba(3,102,214,.07);border-right:1.5px solid var(--border);display:flex;align-items:flex-start;line-height:1.5}
.detail-info-val{font-size:13px;color:var(--txt);line-height:1.6;flex:1;padding:10px 14px}
.detail-modal-close{background:var(--bg);border:1.5px solid var(--border);color:var(--txt2);border-radius:var(--r8);padding:6px 14px;font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .12s,color .12s,border-color .12s}
.detail-modal-close:hover{background:var(--border2);color:var(--txt);border-color:var(--sky100)}
.detail-act-divider{width:1px;align-self:stretch;background:var(--border);margin:0 2px;flex-shrink:0}
.modal-select{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r8);padding:10px 12px;font-size:16px;font-family:inherit;color:var(--txt);outline:none;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%236B7E99' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;transition:border .18s;cursor:pointer}
.modal-select:focus{border-color:var(--sky);background-color:var(--card)}
.modal-required{color:var(--coral);margin-left:2px}
.add-submit-btn{background:var(--sky);border:none;color:#fff;border-radius:var(--r8);padding:10px 24px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;min-height:40px;display:flex;align-items:center;gap:6px}
.add-submit-btn:disabled{opacity:.5;cursor:not-allowed}
.detail-act-btn{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r6);padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;border:1.5px solid transparent;white-space:nowrap;transition:opacity .12s}
.detail-edit-btn{background:var(--sky50);border-color:var(--sky100);color:var(--sky800)}
.detail-edit-btn:hover{background:var(--sky100)}
.detail-del-btn{background:var(--coral50);border-color:var(--coral100);color:var(--coral800)}
.detail-del-btn:hover{background:var(--coral100)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{background:var(--card);border-radius:var(--r20);padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.add-modal-box{max-width:560px;max-height:90vh;overflow-y:auto}
#addModal .modal-backdrop,#detailModal .modal-backdrop{justify-content:flex-end;padding:0}
#addModal .add-modal-box,#detailModal .detail-modal-box{
  height:100vh;height:100dvh;max-height:none;width:460px;max-width:92vw;margin:0;
  border-radius:20px 0 0 20px;
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.22,.8,.25,1);
}
#addModal.drawer-in .add-modal-box,#detailModal.drawer-in .detail-modal-box{transform:translateX(0)}
@media(max-width:480px){
  #addModal .add-modal-box,#detailModal .detail-modal-box{width:100vw;max-width:100vw;border-radius:0}
}
.detail-modal-box{max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:7px}
.modal-field{margin-bottom:14px}
.modal-label{font-size:13px;font-weight:400;color:var(--txt);margin-bottom:6px;display:block}
.modal-input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r8);padding:10px 12px;font-size:16px;font-family:inherit;color:var(--txt);outline:none;transition:border .18s}
@media(min-width:768px){.modal-input,.modal-select{font-size:14px}}
.modal-input[type=number]{-moz-appearance:textfield}
.modal-input[type=number]::-webkit-outer-spin-button,.modal-input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.modal-input::placeholder,.modal-textarea::placeholder,.search-box::placeholder{color:var(--txt3)}
.modal-input:focus{border-color:var(--sky);background:var(--card)}
html[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.85)}
.modal-hint{font-size:12px;color:var(--txt3);margin-top:4px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

<script>
/* ── Worker/DB 연동 정보 (고정값 — 접근 제어는 로그인 토큰으로) ── */
var WORKER_URL = 'https://notion-proxy.shinfund.workers.dev';
var DB_ID = '75359c8c-9c0a-8337-84f3-0175600ce1f2'; // 비품도공DB
var CFG = { workerUrl: WORKER_URL, dbId: DB_ID, authToken:'', authExpires:0 };
(function(){
  try{
    CFG.authToken = localStorage.getItem('wp_authToken')||'';
    CFG.authExpires = parseInt(localStorage.getItem('wp_authExpires')||'0',10)||0;
  }catch(e){}
})();
function isAuthed(){ return !!CFG.authToken && Date.now()<CFG.authExpires; }

/* ── Worker 요청에 로그인 토큰 자동 첨부 + 401 시 로그인 모달 재오픈 ── */
(function(){
  var _fetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    init = init||{};
    var urlStr = typeof input==='string' ? input : (input&&input.url)||'';
    if(urlStr.indexOf(WORKER_URL)===0){
      var headers = new Headers(init.headers||{});
      if(CFG.authToken) headers.set('Authorization','Bearer '+CFG.authToken);
      init = Object.assign({}, init, { headers:headers });
    }
    return _fetch(input, init).then(function(res){
      if(res.status===401 && urlStr.indexOf(WORKER_URL)===0){
        CFG.authToken=''; CFG.authExpires=0;
        try{ localStorage.removeItem('wp_authToken'); localStorage.removeItem('wp_authExpires'); }catch(e){}
        openLoginModal();
      }
      return res;
    });
  };
})();

function toast(msg){ var t=document.getElementById('toast'); if(!t)return; t.textContent=msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },2600); }
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtWon(n){ return (Number(n)||0).toLocaleString('ko-KR',{maximumFractionDigits:2}); }
function fmtWonOrDash(v){ return (v==null||v==='') ? '-' : fmtWon(v); }
function fmt(n){ return n<10 ? '0'+n : String(n); }

/* ── 모달 드래그 이동 ── */
function makeModalDraggable(box, handle){
  if(!box||!handle) return;
  handle.style.cursor='move';
  handle.style.userSelect='none';
  var dragging=false, startX=0, startY=0, startLeft=0, startTop=0;
  function onDown(e){
    var p = e.touches?e.touches[0]:e;
    var rect = box.getBoundingClientRect();
    dragging=true;
    startX=p.clientX; startY=p.clientY;
    startLeft=rect.left; startTop=rect.top;
    box.style.position='fixed';
    box.style.left=startLeft+'px';
    box.style.top=startTop+'px';
    box.style.margin='0';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, {passive:false});
    document.addEventListener('touchend', onUp);
  }
  function onMove(e){
    if(!dragging) return;
    var p = e.touches?e.touches[0]:e;
    if(e.touches) e.preventDefault();
    box.style.left=(startLeft+(p.clientX-startX))+'px';
    box.style.top=(startTop+(p.clientY-startY))+'px';
  }
  function onUp(){
    dragging=false;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:true});
}
function resetModalDragPos(modalId){
  var box = document.querySelector('#'+modalId+' .modal-box');
  if(!box) return;
  box.style.position=''; box.style.left=''; box.style.top=''; box.style.margin='';
}
function initDraggableModals(){
  document.querySelectorAll('.modal-box').forEach(function(box){
    if(box.closest('#addModal') || box.closest('#detailModal')) return;
    var handle = box.querySelector('.modal-title, .detail-modal-hd');
    if(handle) makeModalDraggable(box, handle);
  });
}

/* ── 모달 공통 헬퍼 ── */
function openModal(id){
  var m=document.getElementById(id); if(!m) return;
  m.classList.add('modal-open');
  document.body.style.overflow='hidden';
  if(id==='addModal'||id==='detailModal'){
    m.classList.remove('drawer-in');

/* ── 사진 업로드 (비품대장-수자원 앱 uploadPhoto 패턴 재사용, R2 폴더도 동일하게 asset-register 공유) ── */
var UPLOAD_MAX_BYTES = 500*1024;
var UPLOAD_MAX_LABEL = '500KB';
function compressImageToLimit(file, maxBytes){
  return new Promise(function(resolve, reject){
    if(!file.type || file.type.indexOf('image/')!==0 || file.size<=maxBytes){ resolve(file); return; }
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w=img.naturalWidth, h=img.naturalHeight, quality=0.85, attempts=0;
      var canvas=document.createElement('canvas');
      var ctx=canvas.getContext('2d');
      function step(){
        attempts++;
        canvas.width=w; canvas.height=h;
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(function(blob){
          if(!blob){ reject(new Error('이미지 압축 실패')); return; }
          if(blob.size<=maxBytes){
            resolve(new File([blob], (file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'}));
            return;
          }
          if(attempts>=8){ reject(new Error('이미지를 '+UPLOAD_MAX_LABEL+' 이하로 압축하지 못했습니다. 더 작은 사진을 선택해주세요.')); return; }
          if(quality>0.4) quality-=0.15; else { w=Math.round(w*0.75); h=Math.round(h*0.75); }
          step();
        }, 'image/jpeg', quality);
      }
      step();
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}
var ADD_PHOTOS = [];
function renderPhotoGallery(){
  var el=document.getElementById('photoGallery');
  if(!el) return;
  el.innerHTML = ADD_PHOTOS.map(function(url,i){
    return '<div class="pg-item"><img src="'+esc(url)+'" alt="비품사진" onclick="window.open(\''+esc(url)+'\',\'_blank\')">'
      +'<button type="button" class="pg-remove" aria-label="삭제" onclick="event.stopPropagation();removeAddPhoto('+i+')">×</button></div>';
  }).join('');
}
function removeAddPhoto(i){ ADD_PHOTOS.splice(i,1); renderPhotoGallery(); }
function uploadMultiPhoto(input){
  var files = Array.prototype.slice.call(input.files||[]);
  if(!files.length) return;
  var statusEl = document.getElementById('photoStatus');
  if(!isAuthed()){ statusEl.textContent='⚠ 로그인 필요'; statusEl.className='photo-upload-status err'; return; }
  input.disabled = true;
  var done=0, failed=0;
  statusEl.textContent='업로드 중... (0/'+files.length+')';
  statusEl.className='photo-upload-status';
  var uploadOne=function(file){
    return compressImageToLimit(file, UPLOAD_MAX_BYTES).then(function(outFile){
      if(outFile.size>UPLOAD_MAX_BYTES) throw new Error('파일 용량 초과 (최대 '+UPLOAD_MAX_LABEL+')');
      var formData = new FormData();
      formData.append('file', outFile);
      // 비품대장-수자원 앱과 동일한 R2 폴더(asset-register)를 그대로 공유(사용자 요청)
      formData.append('app', 'asset-register');
      return fetch(CFG.workerUrl+'/upload', { method:'POST', body:formData })
        .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); })
        .then(function(data){ ADD_PHOTOS.push(data.url); });
    }).catch(function(e){ failed++; console.error(e); }).then(function(){
      done++; statusEl.textContent='업로드 중... ('+done+'/'+files.length+')';
      renderPhotoGallery();
    });
  };
  files.reduce(function(p,file){ return p.then(function(){ return uploadOne(file); }); }, Promise.resolve()).then(function(){
    statusEl.textContent = failed ? ('완료('+failed+'건 실패)') : '✓ 업로드 완료';
    statusEl.className = failed ? 'photo-upload-status err' : 'photo-upload-status ok';
    input.value='';
    input.disabled=false;
  });
}
function makePhotoThumb(arr){
  arr = Array.isArray(arr) ? arr : (arr ? [arr] : []);
  arr = arr.filter(function(u){ return u && /^https?:\/\//i.test(u.trim()); });
  if(!arr.length) return '<span style="color:var(--txt3)">-</span>';
  var extra = arr.length>1 ? '<span class="photo-count-badge">+'+(arr.length-1)+'</span>' : '';

    +'<a href="'+esc(arr[0])+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'
    +'<img src="'+esc(arr[0])+'" alt="사진"'
    +' style="width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--border);vertical-align:middle;display:block"'

function buildGenericFilterDd(menuId, btnId, labelId, curVal, values, defLabel, setter, labelFmt){
  var menu=document.getElementById(menuId);
  if(!menu) return;
  var fmt = labelFmt || function(v){ return v; };
  var opts=[{val:'',label:defLabel}].concat(values.map(function(v){ return {val:v,label:fmt(v)}; }));
  menu.innerHTML=opts.map(function(o){ return '<div class="dd-opt'+(curVal===o.val?' sel':'')+'" data-val="'+esc(o.val)+'">'+esc(o.label)+'</div>'; }).join('');
  document.getElementById(labelId).textContent = curVal ? fmt(curVal) : defLabel;
  document.getElementById(btnId).classList.toggle('active', !!curVal);
  if(!menu._bound){
    menu._bound=true;
    menu.addEventListener('click', function(e){
      var opt=e.target.closest('.dd-opt'); if(!opt) return;
      setter(opt.dataset.val); closeDd(menuId, btnId); renderList();
    });
  }
}
function buildTunnelDd(){ buildGenericFilterDd('tunnelDdMenu','tunnelDdBtn','tunnelDdLabel',FILTER_TUNNEL,getUniqueValues('터널명'),'터널명 전체', function(v){ FILTER_TUNNEL=v; }); }
function buildCategoryDd(){ buildGenericFilterDd('categoryDdMenu','categoryDdBtn','categoryDdLabel',FILTER_CATEGORY,sortByCategoryOrder(getUniqueValues('품목분류')),'품목분류 전체', function(v){ FILTER_CATEGORY=v; }); }

/* ── 색상 뱃지(터널/품목분류) ── */
var BADGE_CLASSES=['badge-c0','badge-c1','badge-c2','badge-c3','badge-c4','badge-c5'];
var _tunnelColorMap={};
var _categoryColorMap={};
function ensureColorMap(key, map){
  var seen={}, all=[];
  ALL_DATA.forEach(function(r){ var v=r[key]; if(v && !seen[v]){ seen[v]=1; all.push(v); } });
  Object.keys(map).forEach(function(k){ delete map[k]; });
  all.forEach(function(v,i){ map[v]=BADGE_CLASSES[i%BADGE_CLASSES.length]; });
}
function ensureTunnelColors(){ ensureColorMap('터널명', _tunnelColorMap); }
function tunnelBadgeClass(t){ return _tunnelColorMap[t]||'badge-c0'; }
function ensureCategoryColors(){ ensureColorMap('품목분류', _categoryColorMap); }
function categoryBadgeClass(c){ return _categoryColorMap[c]||'badge-c0'; }

/* ── Notion fetch 헬퍼 ── */
function fetchNotion(body){
  return fetch(CFG.workerUrl+'/v1/databases/'+CFG.dbId+'/query', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    var ct=r.headers.get('content-type')||'';
    if(ct.indexOf('application/json')<0) throw new Error('응답이 JSON이 아닙니다 (content-type: '+ct+') — Worker URL을 확인하세요');
    return r.json();
  }).then(function(json){
    if(json && json.error) throw new Error('Worker 오류: '+(json.error.message||json.error||'알 수 없는 오류'));
    return json;
  });
}

/* ── Notion 실제 속성명 매핑(비품도공DB: 품명/터널명/품목분류/규격/수량/사진/비고) ── */
var NOTION_PROP_MAP = {};
function classifyPropKey(k){
  var lk=k.toLowerCase().replace(/\s/g,'');
  if(lk.indexOf('품명')>=0||lk.indexOf('제품명')>=0) return '품명';
  if(lk.indexOf('터널')>=0) return '터널명';
  if(lk.indexOf('품목분류')>=0||lk.indexOf('구분')>=0||lk.indexOf('분류')>=0) return '품목분류';
  if(lk.indexOf('규격')>=0) return '규격';
  if(lk.indexOf('수량')>=0) return '수량';
  if(lk.indexOf('사진')>=0||lk.indexOf('photo')>=0) return '사진';
  if(lk.indexOf('비고')>=0) return '비고';
  return null;
}
function buildNotionPropMap(props){
  NOTION_PROP_MAP={};
  Object.keys(props).forEach(function(k){
    var cls=classifyPropKey(k);
    if(cls && !NOTION_PROP_MAP[cls]){ NOTION_PROP_MAP[cls]=k; }
  });
  if(!NOTION_PROP_MAP['품명']){
    Object.keys(props).forEach(function(k){ if(!NOTION_PROP_MAP['품명'] && props[k].type==='title'){ NOTION_PROP_MAP['품명']=k; } });
  }
}

/* ── Notion 페이지 파싱 ── */
function getPropText(p){
  if(!p) return '';
  if(p.type==='title') return (p.title||[]).map(function(t){ return t.plain_text||''; }).join('');
  if(p.type==='rich_text') return (p.rich_text||[]).map(function(t){ return t.plain_text||''; }).join('');
  if(p.type==='select') return (p.select&&p.select.name)||'';
  if(p.type==='number') return (p.number!=null) ? p.number : '';
  if(p.type==='date') return (p.date&&p.date.start) ? p.date.start.slice(0,10) : '';
  return '';
}
function getFileUrls(p){
  if(!p) return [];
  if(p.type==='files' && p.files && p.files.length){
    return p.files.map(function(f){ return (f.type==='external' ? (f.external&&f.external.url) : (f.file&&f.file.url)) || ''; }).filter(Boolean);
  }
  if(p.type==='url' && p.url) return [p.url];
  return [];
}
function parseNotionPage(page){
  var props = page.properties||{};
  function get(key){ var nkKey=NOTION_PROP_MAP[key]; return nkKey ? props[nkKey] : null; }
  var name = getPropText(get('품명'));
  if(!name) return null;
  return {
    id: page.id,
    '품명': name,
    '터널명': getPropText(get('터널명')),
    '품목분류': getPropText(get('품목분류')),
    '규격': getPropText(get('규격')),
    '수량': getPropText(get('수량')),
    '사진': getFileUrls(get('사진')),
    '비고': getPropText(get('비고'))
  };
}

/* ── 데이터 로드 (전체를 한 번에 로드 — 구매일 필드가 없어 windowing 불필요) ── */
var ALL_DATA = [];
var MAX_PAGES = 20; // 100건×20페이지=2,000건 상한(안전장치)
function loadData(){
  if(!isAuthed()){ openLoginModal(); return; }
  var btn=document.getElementById('syncBtn'), lu=document.getElementById('lastUpdate');
  var syncIcon=document.getElementById('syncIcon'), syncLabel=document.getElementById('syncLabel');
  if(btn) btn.disabled=true;
  if(btn) btn.setAttribute('aria-busy','true');
  if(syncIcon) syncIcon.classList.add('spinning');
  if(syncLabel) syncLabel.textContent='불러오는 중...';
  if(lu) lu.textContent='';

  fetchNotion({ page_size:1 }).then(function(probe){
    var pages=probe.results||[];
    if(pages.length) buildNotionPropMap(pages[0].properties||{});
    var sortProp = NOTION_PROP_MAP['터널명']||'터널명';
    var body={ page_size:100, sorts:[{ property:sortProp, direction:'ascending' }] };
    return fetchNotion(body).then(function(data){
      var allPages=data.results||[];
      var cursor=data.next_cursor, hasMore=data.has_more, pageCount=0;
      function fetchNext(cur, more){
        if(!cur||!more) return Promise.resolve();
        if(pageCount++>=MAX_PAGES) return Promise.resolve();
        return fetchNotion(Object.assign({},body,{start_cursor:cur})).then(function(d2){
          allPages=allPages.concat(d2.results||[]);
          return fetchNext(d2.next_cursor, d2.has_more);
        });
      }
      return fetchNext(cursor, hasMore).then(function(){
        DELETE_SELECTED = new Set();
        updateDeleteConfirmLabel();
        var parsed = allPages.map(parseNotionPage).filter(Boolean);
        if(parsed.length>0){
          ALL_DATA=parsed;
          ensureTunnelColors(); ensureCategoryColors();
          try{
            localStorage.setItem('portal_summary_equipDogong', JSON.stringify({ totalCount:ALL_DATA.length, updatedAt:Date.now() }));
          }catch(e){}
          renderAll();
          var now=new Date();
          var upTxt='Update '+fmt(now.getMonth()+1)+'.'+fmt(now.getDate())+' '+fmt(now.getHours())+':'+fmt(now.getMinutes());
          if(lu){ lu.textContent=upTxt; lu.style.color=''; }
        } else {
          if(!ALL_DATA.length){ ALL_DATA=DEMO_DATA.slice(); ensureTunnelColors(); ensureCategoryColors(); renderAll(); }
          if(lu){ lu.textContent='⚠ 데이터 없음 — DB ID 또는 Worker 설정 확인'; lu.style.color='var(--hdr-error-text)'; }
        }
      });
    });
  }).catch(function(e){
    var msg=e.message||'';
    var isAuthErr = msg.indexOf('401')>=0;
    if(!ALL_DATA.length || isAuthErr){ ALL_DATA=DEMO_DATA.slice(); ensureTunnelColors(); ensureCategoryColors(); renderAll(); }
    var errMsg='⚠ '+msg;
    if(isAuthErr) errMsg='⚠ 로그인 필요 — 포털 설정에서 로그인';
    else if(msg.indexOf('403')>=0) errMsg='⚠ Worker API 키 확인 (관리자 문의)';
    else if(msg.indexOf('404')>=0) errMsg='⚠ DB를 찾을 수 없음 (관리자 문의)';
    else if(msg.indexOf('Failed to fetch')>=0) errMsg='⚠ 네트워크 오류 — 연결 상태를 확인하세요';
    if(lu){ lu.textContent=errMsg; lu.style.color='var(--hdr-error-text)'; }
    console.error(e);
  }).finally(function(){
    if(btn) btn.disabled=false;
    if(btn) btn.setAttribute('aria-busy','false');
    if(syncIcon) syncIcon.classList.remove('spinning');
    if(syncLabel) syncLabel.textContent='새로고침';
  });
}

/* ── 필터/정렬 ── */
function filtered(){
  return ALL_DATA.filter(function(r){
    if(FILTER_TUNNEL && r['터널명']!==FILTER_TUNNEL) return false;
    if(FILTER_CATEGORY && r['품목분류']!==FILTER_CATEGORY) return false;
    var q=(document.getElementById('searchBox')||{}).value||'';
    q=q.trim().toLowerCase();
    if(q){
      var hay=((r['품명']||'')+' '+(r['규격']||'')+' '+(r['비고']||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

/* 품목분류 표시 순서(사용자 지정 고정 순서 — 알파벳/등장순 아님, 목록·드롭다운·품목분류별탭·엑셀 전체 공유) */
var CATEGORY_ORDER = ['안전장구','예비품','매뉴얼','도면','실적보고서'];
function categoryRank(c){ var i=CATEGORY_ORDER.indexOf(c); return i<0 ? CATEGORY_ORDER.length : i; }
function sortByCategoryOrder(values){ return values.slice().sort(function(a,b){ return categoryRank(a)-categoryRank(b); }); }

/* 터널명↑ · 품목분류(지정순서) · 품명↑ 정렬 비교자(구매일 필드가 없어 터널명 오름차순 기준으로 통일) */
function compareTunnelNameAsc(a, b){
  var at=a['터널명']||'', bt=b['터널명']||'';
  if(at!==bt) return at<bt?-1:1;
  var ac=categoryRank(a['품목분류']), bc=categoryRank(b['품목분류']);
  if(ac!==bc) return ac-bc;
  var an=a['품명']||'', bn=b['품명']||'';
  return an<bn?-1:an>bn?1:0;
}
/* ── 페이지네이션(표시 개수 드롭다운 + 페이지 번호, 공지사항 앱과 동일 패턴) ── */
var PAGE_SIZE_OPTIONS=[10,15,30,50,100];
var PAGE_SIZE = (function(){
  try{
    var raw=localStorage.getItem('assetRegisterDogong_pageSize');
    var v=parseInt(raw,10);
    if(PAGE_SIZE_OPTIONS.indexOf(v)>=0) return v;
    if(raw==='all') return 'all';
  }catch(e){}
  return 15;
})();
var CURRENT_PAGE=1;
function togglePageSizeDd(){ toggleDd('pageSizeDdMenu','pageSizeDdBtn'); }
function buildPageSizeDd(){
  var menu=document.getElementById('pageSizeDdMenu');
  if(!menu) return;
  var opts=PAGE_SIZE_OPTIONS.map(function(n){ return {val:String(n),label:n+'개씩'}; }).concat([{val:'all',label:'전체'}]);
  var curVal = PAGE_SIZE==='all' ? 'all' : String(PAGE_SIZE);
  menu.innerHTML=opts.map(function(o){ return '<div class="dd-opt'+(curVal===o.val?' sel':'')+'" data-val="'+esc(o.val)+'">'+esc(o.label)+'</div>'; }).join('');
  document.getElementById('pageSizeDdLabel').textContent = (opts.filter(function(o){ return o.val===curVal; })[0]||opts[1]).label;
  if(!menu._bound){
    menu._bound=true;
    menu.addEventListener('click', function(e){
      var opt=e.target.closest('.dd-opt'); if(!opt) return;
      var v=opt.dataset.val;
      PAGE_SIZE = v==='all' ? 'all' : parseInt(v,10);
      CURRENT_PAGE=1;
      try{ localStorage.setItem('assetRegisterDogong_pageSize', v); }catch(e2){}
      closeDd('pageSizeDdMenu','pageSizeDdBtn');
      renderRows();
    });
  }
}
function goToPage(n){
  CURRENT_PAGE=n;
  renderRows();
  var wrap=document.querySelector('.detail-sc');
  if(wrap) wrap.scrollIntoView({block:'nearest'});
}
function renderPaginationRow(totalCount, totalPages){
  var el=document.getElementById('paginationRow');
  if(!el) return;
  if(totalPages<=1){ el.innerHTML=''; return; }
  var cur=CURRENT_PAGE;
  var pages=[];
  var win=2;
  for(var i=1;i<=totalPages;i++){
    if(i===1||i===totalPages||(i>=cur-win&&i<=cur+win)) pages.push(i);
    else if(pages[pages.length-1]!=='...') pages.push('...');
  }
  var html='<button class="page-btn" onclick="goToPage('+(cur-1)+')" '+(cur<=1?'disabled':'')+' aria-label="이전 페이지">‹</button>';
  html+=pages.map(function(p){
    if(p==='...') return '<button class="page-btn ellipsis" disabled>…</button>';
    return '<button class="page-btn'+(p===cur?' active':'')+'" onclick="goToPage('+p+')" aria-current="'+(p===cur?'page':'false')+'">'+p+'</button>';
  }).join('');
  html+='<button class="page-btn" onclick="goToPage('+(cur+1)+')" '+(cur>=totalPages?'disabled':'')+' aria-label="다음 페이지">›</button>';
  el.innerHTML=html;
}

/* ── 비품내역 목록 ── */
function renderList(){
  buildTunnelDd(); buildCategoryDd(); buildPageSizeDd();

}
/* 검색어 입력 등 목록만 다시 그리면 되는 경우 — 드롭다운(buildTunnelDd 등)은 옵션 목록이
   실제로 바뀔 때만(데이터 로드·필터 변경·삭제모드 토글 시) renderList()에서 재빌드한다 */
function renderRows(){
  var rows = filtered().slice().sort(compareTunnelNameAsc);
  document.getElementById('detailCount').textContent = '총 '+rows.length+'건';
  var totalPages = PAGE_SIZE==='all' ? 1 : Math.max(1, Math.ceil(rows.length/PAGE_SIZE));
  if(CURRENT_PAGE>totalPages) CURRENT_PAGE=totalPages;
  if(CURRENT_PAGE<1) CURRENT_PAGE=1;
  var pageRows = PAGE_SIZE==='all' ? rows : rows.slice((CURRENT_PAGE-1)*PAGE_SIZE, CURRENT_PAGE*PAGE_SIZE);
  var colCount = 7 + (DELETE_MODE?1:0);
  document.getElementById('detailTableBody').innerHTML = pageRows.length
    ? pageRows.map(buildDetailRow).join('')
    : '<tr><td colspan="'+colCount+'">'+emptyState('조건에 맞는 비품이 없습니다.','🔍')+'</td></tr>';
  if(DELETE_MODE) syncSelectAllCheckbox(rows);
  renderPaginationRow(rows.length, totalPages);
}
function buildDetailRow(r){
  var checkCell = DELETE_MODE
    ? '<td onclick="event.stopPropagation()" style="text-align:center"><input type="checkbox" aria-label="행 선택" '+(DELETE_SELECTED.has(r.id)?'checked':'')+' onchange="toggleRowSelect(\''+r.id+'\',this.checked)"/></td>'
    : '';
  return '<tr onclick="openDetailModal(\''+r.id+'\')" style="cursor:pointer">' + checkCell
    + '<td style="white-space:nowrap"><span class="type-badge '+tunnelBadgeClass(r['터널명'])+'">'+esc(r['터널명']||'—')+'</span></td>'
    + '<td style="white-space:nowrap">'+(r['품목분류']?('<span class="type-badge '+categoryBadgeClass(r['품목분류'])+'">'+esc(r['품목분류'])+'</span>'):'<span style="color:var(--txt3)">-</span>')+'</td>'
    + '<td>'+esc(r['품명']||'-')+'</td>'
    + '<td>'+esc(r['규격']||'-')+'</td>'
    + '<td class="r" style="white-space:nowrap">'+fmtWonOrDash(r['수량'])+'</td>'
    + '<td class="col-photo">'+makePhotoThumb(r['사진']||'')+'</td>'
    + '<td>'+esc(r['비고']||'-')+'</td>'
    + '</tr>';
}
/* ── 행 삭제(체크박스로 전체/개별 선택 후 일괄 삭제) ── */

var DELETE_SELECTED = new Set();
function getVisibleDetailRows(){

}

function updateDeleteToolbarUI(){

function updateDeleteConfirmLabel(){

function updateDeleteHeaderCheckbox(){

      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t); }); return r.json(); })
      .then(function(){ done++; if(confirmBtn) confirmBtn.textContent='삭제 중... ('+done+'/'+ids.length+')'; });

    if(confirmBtn) confirmBtn.disabled=false;
    updateDeleteConfirmLabel();
    console.error(e);

}
function emptyState(desc, icon){

/* ── 터널별/품목분류별 집계(금액 필드가 없어 품목수·총수량만 집계) ── */
function calcGroupMap(rows, key){
  var m={};
  rows.forEach(function(r){
    var g=r[key]||'(미지정)';
    if(!m[g]) m[g]={ count:0, qty:0 };
    m[g].count++;
    m[g].qty += parseFloat(r['수량'])||0;
  });
  return m;
}
function renderGroupPanel(opts){
  var map=calcGroupMap(ALL_DATA, opts.key);
  var arr=Object.keys(map).map(function(k){ return [k,map[k]]; });
  arr = opts.sortFn ? arr.sort(opts.sortFn) : arr.sort(function(a,b){ return b[1].qty-a[1].qty; });
  document.getElementById(opts.badgeId).textContent=arr.length+opts.badgeSuffix;
  document.getElementById(opts.bodyId).innerHTML = arr.length
    ? arr.map(function(pair,i){

/* ── 엑셀 생성 (비품대장-수자원 앱의 buildExcelReport 패턴 재사용 — 사진 컬럼 포함 세로모드) ──
   ~/.claude/skills/xlsx-report-export/SKILL.md "새 탭/앱에 엑셀 버튼 추가하기" 참고 */
var EXCEL_LIB_LOADING = null;
function loadExcelLib(){
  if(window.ExcelJS && window.JSZip) return Promise.resolve();
  if(EXCEL_LIB_LOADING) return EXCEL_LIB_LOADING;
  function loadScript(src, integrity){
    return new Promise(function(resolve, reject){
      var s=document.createElement('script');
      s.src=src; s.integrity=integrity; s.crossOrigin='anonymous';
      s.onload=function(){ resolve(); };
      s.onerror=function(){ s.remove(); reject(new Error('라이브러리 로드 실패: '+src)); };
      document.head.appendChild(s);
    });
  }
  EXCEL_LIB_LOADING = Promise.all([
    window.ExcelJS ? Promise.resolve() : loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','sha384-Pqp51FUN2/qzfxZxBCtF0stpc9ONI6MYZpVqmo8m20SoaQCzf+arZvACkLkirlPz'),
    window.JSZip ? Promise.resolve() : loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG')
  ]).catch(function(e){ EXCEL_LIB_LOADING=null; throw e; });
  return EXCEL_LIB_LOADING;
}
var EXCEL_COMPANY_NAME='수자원기술(주)';
var EXCEL_TITLE_FONT={ name:'HY헤드라인M', size:28 };
var EXCEL_BODY_FONT={ name:'맑은 고딕', size:13 };
var EXCEL_HEADER_FILL={ type:'pattern', pattern:'solid', fgColor:{argb:'FFDAE9F8'} };
var EXCEL_ROW_HEIGHTS={ title:60, header:30, data:30, dataWithPhoto:85 };
function excelGridBorder(isHeader, isLastRow, colIndex, isLastCol){
  return {
    top:{style: isHeader ? 'thin':'hair'},
    bottom:{style: (!isHeader && isLastRow) ? 'thin':'hair'},
    left:{style: colIndex===0 ? 'thin':'hair'},
    right:{style: isLastCol ? 'thin':'hair'}
  };
}
var EXCEL_EMU_PER_PX=9525;
var EXCEL_PHOTO_INSET_EMU=3*EXCEL_EMU_PER_PX;
function excelCm2in(cm){ return cm/2.54; }
var EXCEL_PAGE_PRESETS={
  landscape:{ top:excelCm2in(1), bottom:excelCm2in(1), left:excelCm2in(2), right:excelCm2in(1), header:excelCm2in(1), footer:excelCm2in(1) },
  portrait:{ top:excelCm2in(2), bottom:excelCm2in(1), left:excelCm2in(1.5), right:excelCm2in(1), header:excelCm2in(1), footer:excelCm2in(1) }
};
var EXCEL_COLUMNS_EQUIP=[
  { key:'터널명', header:'터널명' },
  { key:'품목분류', header:'품목분류' },
  { key:'품명', header:'품명', wrap:true },
  { key:'규격', header:'규격', width:22, wrap:true },
  { key:'수량', header:'수량', numFmt:'#,##0.##' },
  { key:'사진', header:'사진', photo:true, width:18 },
  { key:'비고', header:'비고', wrap:true }
];
function excelCharWeight(ch){
  var code=ch.codePointAt(0);
  var cjk=(code>=0xac00&&code<=0xd7a3)||(code>=0x1100&&code<=0x11ff)||(code>=0x3130&&code<=0x318f)||(code>=0x4e00&&code<=0x9fff)||(code>=0xff00&&code<=0xffef);
  return cjk?2:1;
}
function excelStrWidth(s){ var w=0; Array.from(String(s||'')).forEach(function(ch){ w+=excelCharWeight(ch); }); return w; }
function excelAutoWidth(strings, min, max, padding){
  min=min||8; max=max||40; padding=padding===undefined?5:padding;
  var w=min;
  strings.forEach(function(s){ w=Math.max(w, excelStrWidth(s)+padding); });
  return Math.min(w, max);
}
function excelEstimateWrappedLines(text, colWidthChars){
  var w=excelStrWidth(text);
  if(w===0) return 1;
  return Math.max(1, Math.ceil(w/Math.max(1, colWidthChars-2)));
}
function excelWrapAwareRowHeight(row, columns, colWidths, fontSize, baseHeight){
  var maxLines=1;
  columns.forEach(function(col,i){ if(!col.wrap) return; var lines=excelEstimateWrappedLines(row[col.key], colWidths[i]); if(lines>maxLines) maxLines=lines; });
  var lineHeightPt=fontSize*1.4;
  return Math.max(baseHeight, maxLines*lineHeightPt+6);
}
function excelGuessImageExt(contentType, url){
  var t=contentType||'';
  if(t.indexOf('png')>=0) return 'png';
  if(t.indexOf('gif')>=0) return 'gif';
  if(t.indexOf('jpeg')>=0) return 'jpeg';
  var m=(url||'').toLowerCase().match(/\.(png|gif|jpe?g)(\?|$)/);
  if(m) return m[1]==='jpg'?'jpeg':m[1];
  return null;
}
function excelFetchImage(url){
  if(!url || !/^https?:\/\//i.test(url)) return Promise.resolve(null);
  return fetch(url, { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    var contentType=r.headers.get('content-type');
    return r.arrayBuffer().then(function(buf){
      var ext=excelGuessImageExt(contentType, url);
      if(!ext){ console.warn('지원하지 않는 이미지 형식:', url, contentType); return null; }
      return { buffer:buf, extension:ext };
    });
  }).catch(function(e){ console.warn('사진 로드 실패:', url, e.message); return null; });
}
function excelPhotoAnchor(col, rn0){
  return {
    tl:{ nativeCol:col, nativeColOff:EXCEL_PHOTO_INSET_EMU, nativeRow:rn0, nativeRowOff:EXCEL_PHOTO_INSET_EMU },
    br:{ nativeCol:col+1, nativeColOff:-EXCEL_PHOTO_INSET_EMU, nativeRow:rn0+1, nativeRowOff:-EXCEL_PHOTO_INSET_EMU },
    editAs:'twoCell'
  };
}
function excelUnlockAspectRatio(buffer){
  return JSZip.loadAsync(buffer).then(function(zip){
    var files=Object.keys(zip.files).filter(function(f){ return /^xl\/drawings\/drawing\d+\.xml$/.test(f); });
    return Promise.all(files.map(function(f){
      return zip.file(f).async('string').then(function(xml){ zip.file(f, xml.replace(/noChangeAspect="1"/g,'noChangeAspect="0"')); });
    })).then(function(){ return zip.generateAsync({ type:'blob' }); });
  });
}
function excelBatchPromises(items, worker, batchSize){
  batchSize=batchSize||6;
  var idx=0;
  function next(){
    if(idx>=items.length) return Promise.resolve();
    var batch=items.slice(idx, idx+batchSize);
    idx+=batchSize;
    return Promise.all(batch.map(worker)).then(next);
  }
  return next();
}
function buildExcelReport(opts){
  var btn=document.getElementById(opts.btnId);
  var lbl=document.getElementById(opts.lblId);
  var rows=opts.rows;
  if(!rows.length){ alert('내보낼 데이터가 없습니다.'); return; }
  var columns=opts.columns;
  var orientation=opts.orientation||'landscape';
  var failedPhotoCount=0;
  btn.disabled=true; lbl.textContent='준비 중...';

  loadExcelLib().then(function(){
    var wb=new ExcelJS.Workbook();
    var ws=wb.addWorksheet(opts.sheetName, {
      views:[{ state:'frozen', ySplit:2, showGridLines:false, zoomScale:90 }],
      pageSetup:{ paperSize:9, orientation:orientation, fitToPage:true, fitToWidth:1, fitToHeight:0, horizontalCentered:true, verticalCentered:false, margins:EXCEL_PAGE_PRESETS[orientation], printTitlesRow:'2:2' },
      headerFooter:{ oddHeader:'&R&"맑은 고딕,Regular"&11'+EXCEL_COMPANY_NAME, oddFooter:'' }
    });
    var colWidths=columns.map(function(col){
      if(col.width) return col.width;
      var strings = col.photo ? [col.header] : [col.header].concat(rows.map(function(r){ return r[col.key]; }));
      return excelAutoWidth(strings);
    });
    ws.columns=colWidths.map(function(w){ return {width:w}; });

    var titleRow=ws.getRow(1);
    titleRow.height=EXCEL_ROW_HEIGHTS.title;
    var titleCell=titleRow.getCell(1);
    titleCell.value=opts.title; titleCell.font=EXCEL_TITLE_FONT; titleCell.alignment={ vertical:'middle' };

    var headerRow=ws.getRow(2);
    headerRow.height=EXCEL_ROW_HEIGHTS.header;
    columns.forEach(function(col,i){
      var cell=headerRow.getCell(i+1);
      cell.value=col.header; cell.font=EXCEL_BODY_FONT;
      cell.alignment={ vertical:'middle', horizontal:'center' };
      cell.border=excelGridBorder(true, false, i, i===columns.length-1); cell.fill=EXCEL_HEADER_FILL;
    });

    var photoColumns=[];
    columns.forEach(function(c,i){ if(c.photo) photoColumns.push({ col:c, i:i }); });
    var hasPhotoColumns=photoColumns.length>0;
    var rowHeightForData = hasPhotoColumns ? EXCEL_ROW_HEIGHTS.dataWithPhoto : EXCEL_ROW_HEIGHTS.data;

    rows.forEach(function(r,i){
      var rn=3+i;
      var row=ws.getRow(rn);
      row.height=excelWrapAwareRowHeight(r, columns, colWidths, EXCEL_BODY_FONT.size, rowHeightForData);
      columns.forEach(function(col,ci){
        var cell=row.getCell(ci+1);
        cell.font=EXCEL_BODY_FONT; cell.border=excelGridBorder(false, i===rows.length-1, ci, ci===columns.length-1);
        cell.alignment = col.align==='left' ? { vertical:'middle', horizontal:'left', wrapText: !!col.wrap } : { vertical:'middle', horizontal:'center', wrapText: !!col.wrap };
        if(col.photo) return;
        cell.value = (r[col.key]===''||r[col.key]==null) ? '' : r[col.key];
        if(col.numFmt && typeof cell.value==='number') cell.numFmt = Number.isInteger(cell.value) ? col.numFmt.replace(/\.#+/,'') : col.numFmt;
      });
      row.commit();
    });

    var photoTasks=[];
    rows.forEach(function(r,i){
      var rn0=2+i;
      photoColumns.forEach(function(pc){
        var url=r[pc.col.key];
        if(Array.isArray(url)) url=url[0]||'';
        if(url) photoTasks.push({ url:url, colIdx:pc.i, rn0:rn0 });
      });
    });

    if(photoTasks.length) lbl.textContent='사진 불러오는 중...';
    return excelBatchPromises(photoTasks, function(task){
      return excelFetchImage(task.url).then(function(img){
        if(!img){ failedPhotoCount++; return; }
        var imgId=wb.addImage(img);
        ws.addImage(imgId, excelPhotoAnchor(task.colIdx, task.rn0));
      });
    }).then(function(){
      lbl.textContent='파일 저장 중...';
      return wb.xlsx.writeBuffer();
    }).then(function(buf){
      return hasPhotoColumns ? excelUnlockAspectRatio(buf) : new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    });
  }).then(function(blob){
    var url=URL.createObjectURL(blob);
    var now=new Date();
    var fname=opts.fnamePrefix+'_'+now.getFullYear()+fmt(now.getMonth()+1)+fmt(now.getDate())+'.xlsx';
    var a=document.createElement('a'); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    lbl.textContent = failedPhotoCount>0 ? ('완료(사진 '+failedPhotoCount+'건 누락)') : '완료!';
    setTimeout(function(){ lbl.textContent=opts.lblDefault; }, failedPhotoCount>0?3000:1500);
  }).catch(function(e){
    alert('엑셀 생성 실패: '+e.message);
    console.error(e);
    lbl.textContent=opts.lblDefault;
  }).finally(function(){ btn.disabled=false; });
}
